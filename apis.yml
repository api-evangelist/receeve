aid: receeve
name: Receeve
description: >-
  Receeve is a no-code debt collection and receivables management SaaS platform,
  founded in Hamburg, Germany and backed by Speedinvest. It was acquired by
  InDebted and now operates as the "Receive" product — a debt servicing platform
  that lets creditors, banks, lenders, utilities and collection agencies
  automate the full collections lifecycle: importing accounts and claims,
  running configurable dunning strategies and journeys, sending multi-channel
  communications (email, SMS, letters, calls), generating hosted debtor landing
  pages, and reconciling payments, promises-to-pay, instalment plans and
  settlements. The Receive Client API is an OpenAPI 3.0 REST API secured with
  OAuth2 client-credentials (Bearer tokens) and emits an extensive catalog of
  signed webhooks for account, claim, communication, finance, landing-page and
  strategy events.
