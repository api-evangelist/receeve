- name: Strategy
  description: The configured dunning workflow assigned to claims.
- name: Message
  description: An outbound communication (email/SMS/letter/call) to a debtor.
- name: LandingPage
  description: A hosted debtor self-service page (verify, pay, select instalment).
- name: PromiseToPay
  description: A debtor commitment to pay by a date.
- name: InstalmentPlan
  description: A multi-payment plan against one or more claims.
- name: Settlement
  description: A negotiated reduced payoff applied to a claim.
- name: Mandate
  description: A payment mandate (e.g. direct debit authorisation) on an account.
- name: Event
  description: An audit/event record retrievable via get_events and emitted as webhooks.
