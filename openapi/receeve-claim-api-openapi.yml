openapi: 3.0.3
info:
  title: InDebted Receive API Documentation Account Claim API
  description: 'This is the API definition for interacting with InDebted''s Receive debt servicing platform. For more details please visit the [Integration Documentation](https://docs.indebted.co/docs/receive/receive-knowledge-base).


    **Using this spec in code generators, Postman, or other tooling?** Fetch the raw document at [https://receive-api.indebted.co/openapi/apiSchema.yaml](https://receive-api.indebted.co/openapi/apiSchema.yaml) — that is the canonical OpenAPI file. Prefer it over the in-page download button, which re-serialises the document and can alter value types (e.g. date-formatted strings).'
  contact:
    email: techteam@indebted.co
  version: 1.53.1
servers:
- url: /
  description: API base path
tags:
- name: Claim
  description: A claim is an outstanding payment that is owed. You can always update this balance if multiple payments are missed and you want to aggregate the amounts.
  externalDocs:
    description: Account Claims
    url: https://docs.indebted.co/docs/receive/integration/account-claims
paths:
  /v1/{clientId}/get_account_claims:
    get:
      tags:
      - Claim
      summary: It retrieves the claims from a given account
      description: 'The intetion of this endpoint is to fetch the Claims from a given Account.

        For more details about the Account, and the relationship with the other entities please visit the [Account](https://docs.indebted.co/docs/receive/integration/account-claims) page.

        '
      operationId: getAccountClaims
      parameters:
      - $ref: '#/components/parameters/ClientIdParameter'
      - $ref: '#/components/parameters/AuthorizationParameter'
      - $ref: '#/components/parameters/TriggerNameParameter'
      - $ref: '#/components/parameters/AccountReferenceParameter'
      - name: status
        in: query
        required: false
        description: Claim Status filter
        schema:
          type: string
          enum:
          - ACTIVE
          - RESOLVED
          description: 'The Claim is either Active or Resolved, where Active means that there is an existing debt and Resolved means that the debt does not longer exist (there are multiple ways of resolving the Claim other than paying the claim, please refer to the Integration Documentation for further details).

            '
      - name: paginationId
        in: query
        required: false
        description: Get the Account Claims by Pagination
        schema:
          type: string
          description: 'The Pagination will be unique identifier to fetch and traverse the claims page wise with every new request and returns null when no claims founds in DB.

            '
          example: paginationId=eyJhY2NvdW50SWQiOiJBTExBVklOX0FDQ09VTlRfMDEyNyIsImNsaWVudElkIjoiM2QxMzJiMTgtNmI2Zi00ZjdjLWI0NjQtNmE4ZWU3Y2E1MjM1IiwiZXh0ZXJuYWxDbGFpbVJlZiI6IjAyOGZmNDM3LTc2NmItNDNjNC1iY2E4LWVlMTI4OWVhMDZjMCJ9
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10000
        description: amount of events per page, default is 1000
        example: 1000
      responses:
        '200':
          $ref: '#/components/responses/200SuccessGetAccountClaims'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429LimitsReached'
        '500':
          $ref: '#/components/responses/500InternalError'
      security:
      - api_key: []
  /v1/{clientId}/get_debtor_accounts_and_claims:
    get:
      tags:
      - Claim
      summary: It retrieves information about a debtor's accounts and claims
      description: 'The intention of the endpoint is to retrieve information about a debtor''s accounts and claims.

        '
      operationId: getDebtorAccountsAndClaims
      parameters:
      - $ref: '#/components/parameters/ClientIdParameter'
      - $ref: '#/components/parameters/AuthorizationParameter'
      - $ref: '#/components/parameters/TriggerNameParameter'
      - name: debtorReference
        in: query
        required: true
        description: Identifier of the debtor
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/200SuccessGetDebtorAccountsAndClaims'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429LimitsReached'
        '500':
          $ref: '#/components/responses/500InternalError'
      security:
      - api_key: []
  /v1/{clientId}/create_claims:
    post:
      tags:
      - Claim
      summary: Create claims in Receive
      description: 'The intetion of this endpoint is to create Claims in Receive.

        Notes:

        - This endpoint throws an error if the Claim already exists (even if it was deleted).

        - The claims created with this endpoint are not managed by the Ledger.

        For more details about the Claim, and the relationship with the other entities please visit the [Account](https://docs.indebted.co/docs/receive/integration/account-claims) page.

        '
      operationId: createClaims
      parameters:
      - $ref: '#/components/parameters/ClientIdParameter'
      - $ref: '#/components/parameters/AuthorizationParameter'
      - $ref: '#/components/parameters/TriggerNameParameter'
      - $ref: '#/components/parameters/SequentialParameter'
      - $ref: '#/components/parameters/AsyncParameter'
      - $ref: '#/components/parameters/MinorVersionParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: ClaimReference as key and the Claim as value
              additionalProperties:
                $ref: '#/components/schemas/CreateClaimInput'
            examples:
              singleClaim:
                summary: One claim on a new account
                description: Minimal create for a debtor not yet in Receive. The map key (INV-2024-0042) is your own reference and is echoed back verbatim in the response so you can reconcile per claim.
                value:
                  INV-2024-0042:
                    amount: 149900
                    currency: EUR
                    currentDueDate: '2024-05-01'
                    originalDueDate: '2024-05-01'
                    productReference: BROADBAND_PLAN_A
                    accountReference: ACC-DE-5567
                    totalFees: 0
                    primaryDebtor:
                      debtorReference: CUST-88213
                      firstName: Anke
                      lastName: Weber
                      contactInformation:
                        email: anke.weber@example.de
                        country: DE
              batchTwoClaims:
                summary: Several claims in one request
                description: Add more keys to the map to upsert a batch. Each claim is processed independently and reported separately, so a batch can partially succeed.
                value:
                  INV-2024-0042:
                    amount: 149900
                    currency: EUR
                    currentDueDate: '2024-05-01'
                    originalDueDate: '2024-05-01'
                    accountReference: ACC-DE-5567
                    primaryDebtor:
                      debtorReference: CUST-88213
                      firstName: Anke
                      lastName: Weber
                      contactInformation:
                        email: anke.weber@example.de
                        country: DE
                  INV-2024-0043:
                    amount: 52000
                    currency: EUR
                    currentDueDate: '2024-06-15'
                    originalDueDate: '2024-04-30'
                    accountReference: ACC-DE-5568
                    primaryDebtor:
                      debtorReference: CUST-88214
                      firstName: Bernd
                      lastName: Fischer
                      contactInformation:
                        email: bernd.fischer@example.de
                        country: DE
              consolidatedClaim:
                summary: Consolidated claim replacing instalment claims (acceleration)
                description: After accelerating a loan, credit the individual instalment claims and place one claim for the enforceable balance. relatedClaims keeps the consolidation lineage queryable — it is metadata only; Receive does not resolve or modify the referenced claims.
                value:
                  LOAN-2093-ACCEL:
                    amount: 390000
                    currency: EUR
                    currentDueDate: '2024-07-15'
                    originalDueDate: '2024-07-15'
                    accountReference: ACC-DE-5569
                    productReference: LOAN-2093
                    relatedClaims:
                    - type: REPLACES
                      claimReference: LOAN-2093-INST-07
                    - type: REPLACES
                      claimReference: LOAN-2093-INST-08
                    - type: REPLACES
                      claimReference: LOAN-2093-INST-09
                    primaryDebtor:
                      debtorReference: CUST-88215
                      firstName: Carlos
                      lastName: Norte
                      contactInformation:
                        email: carlos.norte@example.de
                        country: DE
      responses:
        '200':
          $ref: '#/components/responses/200SuccessCreateClaims'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429LimitsReached'
        '500':
          $ref: '#/components/responses/500InternalError'
      security:
      - api_key: []
  /v1/{clientId}/recreate_claims:
    post:
      tags:
      - Claim
      summary: Recreate claims in Receive, applicable for already deleted claims.
      description: 'The intetion of this endpoint is to recreate Claims in Receive.

        Notes:

        - This endpoint throws an error if the Claim is not deleted.

        - The claims created with this endpoint are not managed by the Ledger.

        - Recreating the claim will restart the claim lifecycle and the other related entities, this is specially important for the Collections Strategy, that will start from the beginning.

        For more details about the Claim, and the relationship with the other entities please visit the [Account](https://docs.indebted.co/docs/receive/integration/account-claims) page.

        '
      operationId: recreateClaims
      parameters:
      - $ref: '#/components/parameters/ClientIdParameter'
      - $ref: '#/components/parameters/AuthorizationParameter'
      - $ref: '#/components/parameters/TriggerNameParameter'
      - $ref: '#/components/parameters/SequentialParameter'
      - $ref: '#/components/parameters/AsyncParameter'
      - $ref: '#/components/parameters/MinorVersionParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: ClaimReference as key and the Claim as value
              additionalProperties:
                $ref: '#/components/schemas/ClaimInput'
              example:
                CLAIM_REF_002_1:
                  amount: 1000
                  currency: EUR
                  currentDueDate: '2019-02-15'
                  originalDueDate: '2019-09-09'
                  productReference: PRODUCT_REFERENCE_002
                  accountReference: ACCOUNT_REFERENCE_002
                  portfolioReference: EXTERNAL_PORTFOLIO_REFERENCE_002
                  totalFees: 0
                  primaryDebtor:
                    debtorReference: EXTERNAL_DEBTOR_REF_002
                    firstName: F_N
                    lastName: L_N
                    contactInformation:
                      email: first.last@acme.com
                      country: DE
                  meta: {}
      responses:
        '200':
          $ref: '#/components/responses/200SuccessRecreateClaims'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429LimitsReached'
        '500':
          $ref: '#/components/responses/500InternalError'
      security:
      - api_key: []
  /v1/{clientId}/update_claims:
    post:
      tags:
      - Claim
      summary: Update claims in the platform
      description: 'The intetion of this endpoint is to update existing Claims in Receive.

        Notes:

        - This endpoint throws an error if the Claim does not exist.

        - The claims updated with this endpoint are not managed by the Ledger. To update Claims related with the Ledger, use the Ledger related API endpoints.

        - The payload is identical to other Claim related endpoints (like create_claims) but it can receive partial information, only the fields that are updated will be changed.

        For more details about the Claim, and the relationship with the other entities please visit the [Account](https://docs.indebted.co/docs/receive/integration/account-claims) page.

        '
      operationId: updateClaims
      parameters:
      - $ref: '#/components/parameters/ClientIdParameter'
      - $ref: '#/components/parameters/AuthorizationParameter'
      - $ref: '#/components/parameters/TriggerNameParameter'
      - $ref: '#/components/parameters/SequentialParameter'
      - $ref: '#/components/parameters/AsyncParameter'
      - $ref: '#/components/parameters/MinorVersionParameter'
      - name: forceAmountCheck
        in: query
        schema:
          type: boolean
        required: false
        description: The force claim status update when amount is updated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: ClaimReference as key and the Claim as value
              additionalProperties:
                $ref: '#/components/schemas/UpdateClaimInput'
            examples:
              updateAmount:
                summary: Adjust a claim's outstanding amount
                description: Partial upsert — only the fields you send change. Here the balance is raised to 5000 (cents) after a missed payment.
                value:
                  INV-2024-0042:
                    amount: 5000
      responses:
        '200':
          $ref: '#/components/responses/200Success'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429LimitsReached'
        '500':
          $ref: '#/components/responses/500InternalError'
      security:
      - api_key: []
  /v1/{clientId}/import_claims:
    post:
      tags:
      - Claim
      summary: Insert or Update Claims in the platform
      description: 'The intetion of this endpoint is to create/update Claims in Receive.

        It will create a new Claim if the Claim does not exist, or update the existing Claim if it already exists (abstraction over the create_claims and update_claims endpoints).

        Notes:

        - The claims updated with this endpoint are not managed by the Ledger. To update Claims related with the Ledger, use the Ledger related API endpoints.

        - Notice that the payload is identical to other Claim related endpoints (like create_claims), and it requires the full Claim information in the payload, that will be used to upsert the Claim.

        For more details about the Claim, and the relationship with the other entities please visit the [Account](https://docs.indebted.co/docs/receive/integration/account-claims) page.

        '
      operationId: importClaims
      parameters:
      - $ref: '#/components/parameters/ClientIdParameter'
      - $ref: '#/components/parameters/AuthorizationParameter'
      - $ref: '#/components/parameters/TriggerNameParameter'
      - $ref: '#/components/parameters/SequentialParameter'
      - $ref: '#/components/parameters/AsyncParameter'
      - $ref: '#/components/parameters/MinorVersionParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A map of your claim references to claim payloads. Each key is YOUR reference for the claim (any string unique within your system) and is echoed back verbatim in the response so you can reconcile per-claim outcomes. Send several entries to upsert a batch in one call.
              additionalProperties:
                $ref: '#/components/schemas/ImportClaimInput'
            examples:
              newDebtorCreatesAccount:
                summary: New overdue invoice — creates the Account and Claim in one call
                description: No `accountReference` is supplied, so the `anyOf` on the claim requires `primaryDebtor` and `currency`. Receive creates the Account and the Claim together. The map key `INV-2024-0042` is your own reference and comes back unchanged in the response.
                value:
                  INV-2024-0042:
                    amount: 149900
                    currency: EUR
                    originalDueDate: '2024-05-01'
                    currentDueDate: '2024-05-01'
                    productReference: BROADBAND_PLAN_A
                    primaryDebtor:
                      debtorReference: CUST-88213
                      firstName: Anke
                      lastName: Weber
                      contactInformation:
                        email: anke.weber@example.de
                        country: DE
                        mobileNumber: '+491701234567'
              existingAccountWithFeesAndScore:
                summary: Add to an existing Account, with fees, a risk score, and a forced balance check
                description: 'Targets an existing `accountReference`, so `primaryDebtor` and `currency` are optional (inherited from the Account). `forceAmountCheck: true` makes Receive reject the call if `amount` does not equal ledger + fees — use it when you compute the balance yourself and want the API to guard against drift.'
                value:
                  INV-2024-0043:
                    options:
                      forceAmountCheck: true
                    amount: 52000
                    totalFees: 2000
                    currency: EUR
                    originalDueDate: '2024-04-30'
                    currentDueDate: '2024-06-15'
                    accountReference: ACC-DE-5567
                    productReference: MOBILE_PLAN_M
                    fees:
                    - name: Late payment fee
                      amount: 2000
                    scores:
                    - type: INTERNAL
                      value: VERY_GOOD
                    primaryDebtor:
                      debtorReference: CUST-88214
                      firstName: Bernd
                      lastName: Fischer
                      contactInformation:
                        email: bernd.fischer@example.de
                        country: DE
              movementsBreakdown:
                summary: Ledger-driven import with a per-movement credit/debit breakdown
                description: '`movements` is emit-only classification, not state: `amount` is still the source of truth for the claim balance and is NOT recomputed from `movements`. When present, Receive emits one typed credited/debited event per movement instead of a single net event. You are responsible for keeping `amount` consistent with the movements you send. Unknown `direction`/`type` values are rejected with a 400.'
                value:
                  INV-2024-0044:
                    amount: 47000
                    currency: EUR
                    originalDueDate: '2024-04-30'
                    currentDueDate: '2024-06-15'
                    accountReference: ACC-DE-5567
                    productReference: MOBILE_PLAN_M
                    movements:
                    - direction: DEBIT
                      type: INTEREST
                      amount: 2000
                      sourceRef: LEDGER-ENTRY-0042
                    - direction: CREDIT
                      type: PAYMENT
                      amount: 5000
                      sourceRef: LEDGER-ENTRY-0043
      responses:
        '200':
          description: A map keyed by the SAME claim references you sent. Each value reports that claim's outcome independently, so a batch can partially succeed — always inspect every entry's `success` flag.
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/ActionResponse'
              examples:
                newDebtorCreatesAccount:
                  summary: Response for the single-claim upsert
                  value:
                    INV-2024-0042:
                      success: true
                      messages:
                      - Successfully imported claim INV-2024-0042
                      messageIds:
                      - 7f257450-808c-4689-805f-6119cd8580ea
                existingAccountWithFeesAndScore:
                  summary: Response for the fees + score upsert
                  value:
                    INV-2024-0043:
                      success: true
                      messages:
                      - Successfully imported claim INV-2024-0043
                      messageIds:
                      - 3d9b7c2a-1f4e-4a8b-9c6d-2e5f8a1b0c4d
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429LimitsReached'
        '500':
          $ref: '#/components/responses/500InternalError'
      security:
      - api_key: []
  /v1/{clientId}/resolve_claims:
    post:
      tags:
      - Claim
      summary: Resolves Claims with a reason
      description: 'The intetion of this endpoint is to resolve active Claims in Receive.

        Notes:

        - The claim state will change to resolved, but it will not affect other properties of the claim like the amount, due date, etc.

        - To resolve the claim and update the amount to zero, please use the update_claims endpoint with the reason CLAIM_PAID as described in the Integration Documentation.

        For more details about the Claim, and the relationship with the other entities please visit the [Account](https://docs.indebted.co/docs/receive/integration/account-claims) page.

        '
      operationId: resolveClaims
      parameters:
      - $ref: '#/components/parameters/ClientIdParameter'
      - $ref: '#/components/parameters/AuthorizationParameter'
      - $ref: '#/components/parameters/TriggerNameParameter'
      - $ref: '#/components/parameters/SequentialParameter'
      - $ref: '#/components/parameters/AsyncParameter'
      - $ref: '#/components/parameters/MinorVersionParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  ref:
                    type: string
                    example: CLAIM_REF_002
                  reason:
                    $ref: '#/components/schemas/ClaimResolutionReason'
            examples:
              resolvePaid:
                summary: Resolve a single claim that was paid in full
                description: Marks the claim resolved with reason CLAIM_PAID. Resolution changes state only — it does NOT zero the balance; use update_claims for that. reason is one of CLAIM_SOLD, CLAIM_PAID, FRAUDULENT, CLAIM_DISCARDED, CLAIM_DISCHARGED, CLAIM_INVALIDATED.
                value:
                - ref: INV-2024-0042
                  reason: CLAIM_PAID
              resolveBatch:
                summary: Resolve several claims with different reasons
                value:
                - ref: INV-2024-0042
                  reason: CLAIM_PAID
                - ref: INV-2024-0043
                  reason: CLAIM_SOLD
      responses:
        '200':
          $ref: '#/components/responses/200Success'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429LimitsReached'
        '500':
          $ref: '#/components/responses/500InternalError'
      security:
      - api_key: []
  /v1/{clientId}/credit_claims:
    post:
      tags:
      - Claim
      summary: Credit claims
      description: "The intention of this endpoint is to credit claims in Receive.\nNotes:\n  - Crediting the claim will decrease the amount of the claim.\n  - If the claim amount is zero, the claim will be resolved.\n  - When you provide fees as a number, it will reduce totalFees of the claim\n  - When you provide fees as an array, we check\n    - if a fee with same name already exists for the claim, if so, we substract incoming fee amount from existing fee amount and subtract fee.amount from totalFees of the claim\n    - if a fee with same name does not exist, we ignore it\n  - if you want to credit to fees only, set amount to 0.\n  - if you want to credit to fees first, and then remaining amount to claim amount, do not send `fees` field (send `amount` only)\nFor more details about the Claim, and the relationship with the other entities please visit the [Account](https://docs.indebted.co/docs/receive/integration/account-claims) page.\n"
      operationId: creditClaims
      parameters:
      - $ref: '#/components/parameters/ClientIdParameter'
      - $ref: '#/components/parameters/AuthorizationParameter'
      - $ref: '#/components/parameters/TriggerNameParameter'
      - $ref: '#/components/parameters/SequentialParameter'
      - $ref: '#/components/parameters/AsyncParameter'
      - $ref: '#/components/parameters/MinorVersionParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: claimReference as key and CreditClaimInput object as value
              additionalProperties:
                $ref: '#/components/schemas/CreditClaimInput'
              example:
                API_CLAIM_REF_002_1:
                  amount: 1000
                  currency: EUR
                  originator: DCA
                  date: 1647526514000
                  descriptionText: The claim received a partial payment through the DCA
                  paymentDistributionPriority: AMOUNT_FIRST
                API_CLAIM_REF_002_2:
                  amount: 1000
                  fees: 500
                  currency: EUR
                  originator: DCA
                  date: 1647526514000
                  descriptionText: The claim received a partial payment through the DCA
                  paymentDistributionPriority: AMOUNT_FIRST
                API_CLAIM_REF_002_3:
                  amount: 1000
                  fees:
                  - name: Processing Fee
                    amount: 25
                  - name: Late Fee
                    amount: 15
                  currency: EUR
                  originator: DCA
                  date: 1647526514000
                  descriptionText: The claim received a partial payment through the DCA
                  paymentDistributionPriority: AMOUNT_FIRST
      responses:
        '200':
          $ref: '#/components/responses/200SuccessCreditClaim'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429LimitsReached'
        '500':
          $ref: '#/components/responses/500InternalError'
      security:
      - api_key: []
  /v1/{clientId}/debit_claims:
    post:
      tags:
      - Claim
      summary: Debit claims
      description: "The intention of this endpoint is to debit claims in Receive.\nNotes:\n  - Debiting the claim will increase the amount and/or totalFees of the claim.\n  - When you provide fees as a number, it will be added to the totalFees of the claim\n  - When you provide fees as an array, we check\n    - if a fee with same name already exists for the claim, if so, we add incoming fee amount to existing fee amount and add fee.amount to totalFees of the claim\n    - if a fee with same name does not exist, we create a new fee with the provided name and add fee.amount to totalFees of the claim\n  - if you want to debit to fees only, set amount to 0.\nFor more details about the Claim, and the relationship with the other entities please visit the [Account](https://docs.indebted.co/docs/receive/integration/account-claims) page.\n"
      operationId: debitClaims
      parameters:
      - $ref: '#/components/parameters/ClientIdParameter'
      - $ref: '#/components/parameters/AuthorizationParameter'
      - $ref: '#/components/parameters/TriggerNameParameter'
      - $ref: '#/components/parameters/SequentialParameter'
      - $ref: '#/components/parameters/AsyncParameter'
      - $ref: '#/components/parameters/MinorVersionParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: claimReference as key and DebitClaimInput object as value
              additionalProperties:
                $ref: '#/components/schemas/DebitClaimInput'
            examples:
              debitAmountAndFees:
                summary: Increase the amount and fees of active claims
                value:
                  API_CLAIM_REF_002_1:
                    amount: 1000
                    currency: EUR
                    originator: CLIENT
                    date: 1647526514000
                    fees: 50
                  API_CLAIM_REF_002_2:
                    amount: 1500
                    currency: EUR
                    originator: CLIENT
                    date: 1647526514000
                    fees:
                    - name: Processing Fee
                      amount: 25
                    - name: Late Fee
                      amount: 15
              chargebackReactivation:
                summary: Payment reversal (chargeback) — restore the balance AND reactivate a resolved claim
                description: 'A debit against a RESOLVED claim restores the balance but leaves the claim RESOLVED. Set `options.forceAmountCheck: true` to recompute the status from the resulting balance, reactivating the claim (and clearing its resolution reason) in the same call.'
                value:
                  INV-2024-0042:
                    amount: 149900
                    currency: EUR
                    originator: CLIENT
                    date: 1647526514000
                    descriptionText: Chargeback of payment PSP-REF-8842
                    options:
                      forceAmountCheck: true
      responses:
        '200':
          $ref: '#/components/responses/200SuccessDebitClaim'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429LimitsReached'
        '500':
          $ref: '#/components/responses/500InternalError'
      security:
      - api_key: []
  /v1/{clientId}/set_link_claims:
    post:
      tags:
      - Claim
      summary: Set link claims
      description: "Links claims into a shared-liability group or breaks existing links.\n\n**What linking does:** Claims in the same link group become synced mirrors of the same underlying debt. Whenever any claim in the group is updated, the platform overwrites the `amount`, `totalFees`, and `fees` fields on every other claim in the group via `cmd.linkedClaims.sync`. This means all linked claims always reflect the same balance.\n\n**Intended use case — shared liability only:** Use linking when multiple accounts (e.g. co-debtors or guarantors) each hold a separate claim representing the same debt. Linking keeps their balances in sync automatically.\n\n**Do NOT use for instalments or independent claims:** Linking instalments of a single purchase, or any set of claims with different individual balances, will cause every claim's amount to overwrite the others', corrupting all balances in the group.\n\nNotes:\n  - Provide a mapping of external claim references to other claim references to link them\n  - Use null as the value to unlink a claim\n\nFor more details about the Claim, and the relationship with the other entities please visit the [Account](https://docs.indebted.co/docs/receive/integration/account-claims) page.\n"
      operationId: setLinkClaims
      parameters:
      - $ref: '#/components/parameters/ClientIdParameter'
      - $ref: '#/components/parameters/AuthorizationParameter'
      - $ref: '#/components/parameters/TriggerNameParameter'
      - $ref: '#/components/parameters/AsyncParameter'
      - $ref: '#/components/parameters/MinorVersionParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: External claim reference as key and target claim reference (or null to unlink) as value
              additionalProperties:
                type: string
                nullable: true
              example:
                API_CLAIM_REF_002: API_CLAIM_REF_001
                API_CLAIM_REF_003: API_CLAIM_REF_001
      responses:
        '200':
          $ref: '#/components/responses/200Success'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429LimitsReached'
        '500':
          $ref: '#/components/responses/500InternalError'
      security:
      - api_key: []
components:
  schemas:
    ClaimScore:
      type: object
      description: An Claim Score is a score that is calculated for a specific claim.
      required:
      - type
      - value
      properties:
        type:
          type: string
          description: Type of score
          enum:
          - INTERNAL
          - EXTERNAL
          - COLLECTION
          - BEHAVIORAL
        value:
          nullable: true
          oneOf:
          - type: string
            example: risky
            description: The score's value
          - type: object
            description: composed value
        meta:
          $ref: '#/components/schemas/Metadata'
    RelatedClaim:
      type: object
      description: A typed relation from this claim to another claim (lineage metadata; the platform does not act on it)
      required:
      - type
      - claimReference
      additionalProperties: false
      properties:
        type:
          type: string
          description: 'Relation type, declared on THIS claim pointing at the referenced claim (single direction; inverses are derived at query time). REPLACES: this claim supersedes the referenced ones (e.g. a consolidated claim placed at acceleration after crediting the individual instalment claims). SPLIT_FROM: this claim was split out of the referenced claim (e.g. the disputed portion of an invoice separated for independent handling). REINSTATES: this claim places debt back into collection after the referenced claim was already resolved (e.g. a settlement breached after the original claim was closed). REFINANCES: this claim is a new credit agreement curing the referenced claims under new terms — counts as recovery. RESTRUCTURES: this claim re-schedules the referenced debt by agreement with the debtor (workout/forbearance executed in your core system and placed as a new claim — restructures executed inside Receive use an Instalment Plan instead; do not create a new claim for those). DEFERS: this fee claim gates a due-date deferral of the referenced claims.'
          enum:
          - REPLACES
          - SPLIT_FROM
          - REINSTATES
          - REFINANCES
          - RESTRUCTURES
          - DEFERS
        claimReference:
          type: string
          minLength: 1
          description: Your reference of the related claim
          example: API_CLAIM_REF_INST_001
    CreditClaimActionResponse:
      allOf:
      - $ref: '#/components/schemas/ActionResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/CreditClaimInput'
    BaseContactInformation:
      type: object
      properties:
        country:
          type: string
          example: DE
          pattern: ^[A-Z]{2}$
          description: 2-digit country code (ISO 3166-1). This is required for the localization and payment providers.
        city:
          type: string
          minLength: 1
          example: Delbrück
          description: City
        mobileNumber:
          type: string
          example: 495555555555
          description: Mobile Number
          pattern: ^\+\d{1,3}\d{9,12}$
        postalCode:
          type: string
          example: 33129
          minLength: 1
          description: Postal Code
        houseNumber:
          type: string
          minLength: 1
          example: 24A
          description: House number as part of the address
        addressLine1:
          type: string
          example: Boikweg 24
          minLength: 1
          description: Address Line 1
        addressLine2:
          type: string
          example: c/o Acme
          minLength: 1
          description: Address Line 2
        addressLine3:
          type: string
          minLength: 1
          example: first floor
          description: Address Line 3
        landLine:
          type: string
          example: 495555555555
          description: Land Line
          pattern: ^\+\d{1,3}\d{9,12}$
        state:
          type: string
          example: Dortmund
          minLength: 1
          description: State
        email:
          type: string
          description: Email Address
          example: testEmail@example.com
        additionalContactInformation:
          type: array
          items:
            oneOf:
            - type: object
              required:
              - email
              additionalProperties: false
              properties:
                email:
                  type: string
                  description: Email Address
                  example: testEmail@example.com
            - type: object
              required:
              - mobileNumber
              additionalProperties: false
              properties:
                mobileNumber:
                  type: string
                  description: Mobile Number
                  example: 495555555555
                  pattern: ^\+\d{1,3}\d{9,12}$
            - type: object
              required:
              - landLine
              additionalProperties: false
              properties:
                landLine:
                  type: string
                  description: Land Line Number
                  example: 495555555555
                  pattern: ^\+\d{1,3}\d{9,12}$
            - type: object
              required:
              - workPhoneNumber
              additionalProperties: false
              properties:
                workPhoneNumber:
                  type: string
                  description: Work Phone Number
                  example: 495555555555
                  pattern: ^\+\d{1,3}\d{9,12}$
    PaymentReference:
      type: string
      minLength: 1
      example: paymentReference1
      description: 'Payment reference used in online transactions.

        It is a text reference that can be used to map the money transactions to other external systems.

        '
    Movement:
      type: object
      description: 'A single credit/debit movement contributing to a claim import. Emit-only classification, not state: movements never drive the claim `amount` — they only determine which typed credited/debited events Receive emits.'
      required:
      - direction
      - amount
      additionalProperties: false
      properties:
        direction:
          type: string
          enum:
          - CREDIT
          - DEBIT
          description: Whether the movement decreases (CREDIT) or increases (DEBIT) the outstanding claim amount
        amount:
          type: integer
          minimum: 0
          description: The movement amount [cents]
          example: 5000
        type:
          type: string
          enum:
          - PAYMENT
          - DISCOUNT
          - ADJUSTMENT
          - CHARGEBACK
          - INTEREST
          description: 'Typed classification of the movement, reusing the claim credit/debit vocabulary: PAYMENT, DISCOUNT, or ADJUSTMENT for a CREDIT; ADJUSTMENT, CHARGEBACK, or INTEREST for a DEBIT.'
        sourceRef:
          type: string
          minLength: 1
          description: Opaque reference correlating this movement to the record that produced it (e.g. a ledger entry reference). Passed through verbatim; never interpreted by Receive.
          example: LEDGER-ENTRY-0001
    ProductReference:
      type: string
      minLength: 1
      example: PRODUCT_REFERENCE_1
      description: Identifier for a product in your system. It is used for grouping purposes.
    CreditClaimInput:
      type: object
      required:
      - amount
      - currency
      - originator
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        fees:
          oneOf:
          - type: number
            description: Fees as a numeric value
          - type: array
            items:
              $ref: '#/components/schemas/Fee'
            description: Array of Fee objects with name and amount
          description: Fees for the credit claim, can be a number or array of Fee objects
        currency:
          $ref: '#/components/schemas/Currency'
        originator:
          type: string
          enum:
          - DCA
          - CLIENT
        paymentDistributionPriority:
          type: string
          enum:
          - FEES_FIRST
          - AMOUNT_FIRST
          description: Defines the priority for payment distribution (whethere the payment amount should be distributed to claim's principal amount first or to claim's fees first)
        creditType:
          type: string
          enum:
          - PAYMENT
          - DISCOUNT
          - ADJUSTMENT
          description: Typed classification of the credit, mirroring the ledger entry types. Omitted implies PAYMENT (today's implicit semantics).
        date:
          type: number
          description: date of credit (unix timestamp in msec)
          example: 1647526514000
        descriptionText:
          type: string
          description: some description for credit
        context:
          type: object
          description: 'Optional free-form context forwarded to the claim credit event.

            Up to 10 key-value pairs. Values may be string, number, boolean, or null.

            '
          maxProperties: 10
          additionalProperties:
            nullable: true
            oneOf:
            - type: string
            - type: number
            - type: boolean
    RecreateClaims:
      allOf:
      - $ref: '#/components/schemas/ActionResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/ClaimInput'
    DebitClaimInput:
      type: object
      required:
      - amount
      - currency
      - originator
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        fees:
          oneOf:
          - type: number
            description: Fees as a numeric value
          - type: array
            items:
              $ref: '#/components/schemas/Fee'
            description: Array of Fee objects with name and amount
          description: Fees for the debit claim, can be a number or array of Fee objects
        currency:
          $ref: '#/components/schemas/Currency'
        originator:
          type: string
          enum:
          - DCA
          - CLIENT
        debitType:
          type: string
          enum:
          - ADJUSTMENT
          - CHARGEBACK
          - INTEREST
          description: Typed classification of the debit, mirroring the ledger entry types. Optional with no default.
        date:
          type: number
          description: date of debit (unix timestamp in msec)
          example: 1647526514000
        descriptionText:
          type: string
          description: some description for debit
        context:
          type: object
          description: 'Optional free-form context forwarded to the claim debit event.

            Up to 10 key-value pairs. Values may be string, number, boolean, or null.

            '
          maxProperties: 10
          additionalProperties:
            nullable: true
            oneOf:
            - type: string
            - type: number
            - type: boolean
        options:
          type: object
          additionalProperties: false
          description: Debit options
          properties:
            forceAmountCheck:
              type: boolean
              example: false
              description: 'Recompute the claim status from the resulting balance. Use on payment reversals (chargebacks): a debit against a RESOLVED claim restores the balance but does NOT reactivate it unless this flag is set.'
    UpdateClaimInput:
      description: Input for update_claims endpoint.
      allOf:
      - $ref: '#/components/schemas/BaseClaim'
      - $ref: '#/components/schemas/UpdateClaimOptions'
    DueDate:
      type: string
      format: date
      example: '2019-06-28'
      description: Current due date in your system. Use originalDueDate unless you purchased the debt and need this distinction.
    CreateClaimInput:
      description: Input for create_claims endpoint.
      allOf:
      - $ref: '#/components/schemas/ClaimInput'
    Amount:
      minimum: 0
      type: integer
      example: 13025
      description: Monetary value in cents (natural nuumber)
    ClaimOrigination:
      type: object
      description: The product/service context and origin of the claim
      required:
      - type
      - name
      properties:
        type:
          type: string
          enum:
          - product
          - service
          description: Whether the claim originates from a product or a service
        name:
          type: string
          minLength: 1
          description: Name of the product/service
          example: Loan
        brand:
          type: string
          minLength: 1
          description: Brand of the product
          example: CreditLimit
        code:
          type: string
          minLength: 1
          description: External code/identifier of the product
          example: CL
    BaseDebtor:
      type: object
      properties:
        birthday:
          type: string
          format: date
          example: '1980-06-28'
          description: Birthday of the debtor
        gender:
          type: string
          example: M
          pattern: ^(M|F)$
          description: Gender of the debtor
        firstName:
          type: string
          example: John
          minLength: 1
          description: First name of the debtor (required if type is 'natural')
        lastName:
          type: string
          example: White
          minLength: 1
          description: Last name of the debtor (required if type is 'natural')
        middleName:
          type: string
          example: Benedict
          minLength: 1
          description: Middle name of the debtor
        title:
          type: string
          minLength: 1
          example: Doctor
          description: Title of the debtor
        companyName:
          type: string
          minLength: 1
          example: Acme Brick Co.
          description: Company Name of the debtor (required if type is 'legal')
        debtorReference:
          $ref: '#/components/schemas/DebtorReference'
        SSN:
          type: string
          example: AAA-GG-SSSS
          description: National Identification Number of the debtor
        type:
          type: string
          example: natural
          enum:
          - natural
          - legal
          description: 'Type of the debtor (default: natural)'
        contactInformation:
          $ref: '#/components/schemas/BaseContactInformation'
    AccountReference:
      type: string
      minLength: 1
      example: ACCOUNT_REFERENCE_002
      description: Account reference in your system
    ClaimInput:
      description: Used when creating or importing claims
      allOf:
      - $ref: '#/components/schemas/BaseClaim'
      - type: object
        required:
        - originalDueDate
        - currentDueDate
        - amount
        properties:
          originalDueDate:
            $ref: '#/components/schemas/OriginalDueDate'
          currentDueDate:
            $ref: '#/components/schemas/DueDate'
      - anyOf:
        - type: object
          description: The `accountReference` is optional, but `primaryDebtor` and `currency` are required
          required:
          - primaryDebtor
          - currency
          properties:
            primaryDebtor:
              $ref: '#/components/schemas/Debtor'
        - type: object
          description: The `primaryDebtor` and the `currency` of the `Account` is used if not specified in the `Claim`
          required:
          - accountReference
    BaseClaim:
      type: object
      description: A claim is an outstanding payment that is owed. You can always update this balance if multiple payments are missed and you want to aggregate the amounts.
      minProperties: 1
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        product:
          $ref: '#/components/schemas/Product'
        portfolioReference:
          $ref: '#/components/schemas/PortfolioReference'
        productReference:
          $ref: '#/components/schemas/ProductReference'
        creditorReference:
          type: string
          minLength: 1
          description: Reference of the person/company to whom money is owed
        totalFees:
          $ref: '#/components/schemas/Amount'
        currentDueDate:
          $ref: '#/components/schemas/DueDate'
        originalDueDate:
          $ref: '#/components/schemas/OriginalDueDate'
        scores:
          type: array
          description: List of scores
          items:
            $ref: '#/components/schemas/ClaimScore'
        reason:
          type: string
          minLength: 1
          deprecated: true
          description: Reason for updating a claim (the reason must not be part of the Entity)
        paymentReference:
          $ref: '#/components/schemas/PaymentReference'
        accountNumber:
          allOf:
          - $ref: '#/components/schemas/AccountReference'
          - minLength: 1
            deprecated: true
            description: Account number in your system (DEPRECATED, use accountReference)
        accountReference:
          $ref: '#/components/schemas/AccountReference'
        meta:
          $ref: '#/components/schemas/Metadata'
        fees:
          type: array
          description: List of fees. If neither fees nor totalFees are provided - we treat totalFees as 0. Using this field overwrites the totalFees value if you provided it as well.
          items:
            $ref: '#/components/schemas/Fee'
        linkGroupId:
          description: 'Shared-liability group identifier. Claims sharing a linkGroupId are synced mirrors of the same underlying debt: whenever one claim in the group is updated via cmd.linkedClaims.sync, the fields amount, totalFees, and fees are overwritten on every other claim in the group. Use this field only for shared-liability scenarios (e.g. co-debtors or guarantors each holding a separate account for the same debt). Do NOT use it to group related-but-independent claims such as instalments of a single purchase — doing so would cause every instalment''s amount to overwrite the others''.

            '
          type: string
          format: uuid
          nullable: true
        origination:
          $ref: '#/components/schemas/ClaimOrigination'
        repaymentsHistory:
          type: array
          description: Pre-sale payment history for the claim
          items:
            $ref: '#/components/schemas/Repayment'
        relatedClaims:
          type: array
          description: Typed relations from this claim to other claims. Lineage metadata only — the platform does not act on it. Use it to keep consolidation history queryable, e.g. an accelerated claim declaring which instalment claims it replaces.
          items:
            $ref: '#/components/schemas/RelatedClaim'
        primaryDebtor:
          $ref: '#/components/schemas/BaseDebtor'
    DebtorReference:
      type: string
      minLength: 1
      example: EXTERNAL_DEBTOR_REF_002
      description: Your customer ID for this person or company
    OriginalDueDate:
      type: string
      format: date
      example: '2019-06-28'
      description: Original due date in your system. This is the day when it went past due. DPD 0.
    Debtor:
      description: 'The Debtor is the entity that owes the money. It can be a person (natural) or a company (legal).

        Notes:

        - If the debtor is a person (natural), then firstName and lastName are required.

        - If the debtor is a company (legal), then companyName is required.

        '
      allOf:
      - $ref: '#/components/schemas/BaseDebtor'
      - type: object
        required:
        - debtorReference
        - contactInformation
        properties:
          contactInformation:
            $ref: '#/components/schemas/ContactInformation'
    ClaimResponse:
      type: object
      allOf:
      - $ref: '#/components/schemas/Claim'
      - required:
        - claimReference
        - status
        properties:
          claimReference:
            type: string
            minLength: 1
            description: The current claim's reference
          status:
            type: string
            enum:
            - ACTIVE
            - RESOLVED
    Currency:
      type: string
      example: EUR
      pattern: ^[A-Z]{3}$
      description: 3-digit currency code (ISO 4217)
    Repayment:
      type: object
      description: A repayment entry in the pre-sale payment history of a claim
      required:
      - amount
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        date:
          type: string
          format: date
          nullable: true
          description: Date of that repayment
          example: '2019-06-28'
        dueDate:
          type: string
          format: date
          description: Due date of that repayment
          example: '2019-06-28'
        outstandingAmount:
          allOf:
          - $ref: '#/components/schemas/Amount'
          description: Outstanding amount after the repayment in cents
        meta:
          $ref: '#/components/schemas/Metadata'
    DebitClaimActionResponse:
      allOf:
      - $ref: '#/components/schemas/ActionResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/DebitClaimInput'
    Metadata:
      type: object
      description: Additional information related to the entity.
      example:
        sourceSystem: system1
    ClaimResolutionReason:
      type: string
      enum:
      - CLAIM_SOLD
      - CLAIM_PAID
      - FRAUDULENT
      - CLAIM_DISCARDED
      - CLAIM_DISCHARGED
      - CLAIM_INVALIDATED
      example: CLAIM_PAID
      description: 'The reason for the claim resolution.

        '
    ImportClaimInput:
      description: Input for update_claims endpoint.
      allOf:
      - $ref: '#/components/schemas/ClaimInput'
      - $ref: '#/components/schemas/UpdateClaimOptions'
      - type: object
        properties:
          movements:
            type: array
            description: 'Optional per-entry breakdown of the credit/debit movements behind this claim import. Emit-only classification, not state: the `amount` you send remains the source of truth for the claim balance — movements are never used to recompute it. When present, Receive emits one typed credited/debited event per movement instead of a single net event; you are responsible for keeping `amount` consistent with the movements you send. Absent -> behaviour identical to today.'
            items:
              $ref: '#/components/schemas/Movement'
    CreateClaims:
      allOf:
      - $ref: '#/components/schemas/ActionResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/ClaimInput'
    UpdateClaimOptions:
      description: Additional modifiers when updating claims
      properties:
        options:
          properties:
            forceAmountCheck:
              type: boolean
              example: false
              description: Let the claim status the same, regardless of the changes in the amount
    Claim:
      allOf:
      - $ref: '#/components/schemas/BaseClaim'
      - type: object
        required:
        - currency
        - primaryDebtor
        - accountReference
        - originalDueDate
        - currentDueDate
        - amount
        properties:
          primaryDebtor:
            $ref: '#/components/schemas/Debtor'
    ContactInformation:
      description: 'Contact information of the debtor, used for communication purposes.

        '
      allOf:
      - $ref: '#/components/schemas/BaseContactInformation'
      - type: object
        required:
        - country
    ActionResponse:
      type: object
      description: Response of any action that causes any side effect in the platform (e.g. create, update, delete)
      required:
      - success
      - messages
      - messageIds
      properties:
        success:
          type: boolean
          example: false
          description: Status of the action
        messages:
          type: array
          items:
            type: string
            example: Successfully created claim claim1
            description: Human-friendly message about the action
        messageIds:
          type: array
          description: Identifier of the messages (used for tracing)
          items:
            type: string
            format: uuid
            example: 32638681-bb15-400d-acc8-15bf8e38661e
      example:
        success: true
        messages:
        - Successfully processed action
        messageIds:
        - e66d62ed-2331-4ced-8c03-5e729e984adc
    PortfolioReference:
      type: string
      minLength: 1
      example: EXTERNAL_PORTFOLIO_REFERENCE_002
      description: This is a optional grouping field for reporting purposes.
    DebtorAccountsAndClaims:
      type: array
      items:
        type: object
        allOf:
        - type: object
          required:
          - currency
          - accountReference
          properties:
            accountReference:
              $ref: '#/components/schemas/AccountReference'
            meta:
              $ref: '#/components/schemas/Metadata'
            paymentReference:
              $ref: '#/components/schemas/PaymentReference'
            portfolioReference:
              $ref: '#/components/schemas/PortfolioReference'
            currency:
              $ref: '#/components/schemas/Currency'
        - type: object
          required:
          - claims
          properties:
            claims:
              type: array
              items:
                $ref: '#/components/schemas/Claim'
        - type: object
          required:
          - debtors
          properties:
            debtors:
              type: array
              items:
                $ref: '#/components/schemas/Debtor'
    Product:
      type: object
      description: A product is a service or item used to give context to the Claim or Ledger Entry
      required:
      - productReference
      properties:
        productReference:
          $ref: '#/components/schemas/ProductReference'
        paymentReference:
          $ref: '#/components/schemas/PaymentReference'
        type:
          type: string
          minLength: 1
          example: Computer
          description: Type of product
        name:
          type: string
          minLength: 1
          example: Macbook Pro
          description: Product name
        code:
          type: string
          minLength: 1
          example: 111-22222-3333
          description: Product code
        meta:
          $ref: '#/components/schemas/Metadata'
    Fee:
      type: object
      description: Additional expected payment amount.
      required:
      - name
      - amount
      properties:
        name:
          type: string
          minLength: 1
          description: 'Fee bucket name. `debit_claims` and `credit_claims` merge fees by exact name: the same name adjusts the existing bucket, on debit an unknown name creates a new bucket, and on credit an unknown name is silently ignored. Renaming a bucket mid-lifecycle fragments its history. Recommended canonical names: `interest`, `defaultInterest`, `lateFee`, `dunningFee`, `collectionCosts`, `repossessionCosts`. Any non-empty string is accepted.'
          example: interest
        amount:
          $ref: '#/components/schemas/Amount'
  parameters:
    SequentialParameter:
      name: sequential
      in: query
      required: false
      description: The request body items are executed one after another one
      schema:
        type: boolean
    AsyncParameter:
      name: async
      in: query
      required: false
      description: The request is added to the queue without expecting the response
      schema:
        type: boolean
    ClientIdParameter:
      name: clientId
      in: path
      required: true
      description: 'A Receive system identifier that will be assigned automatically.

        It will be used for situations like Support related interventions or data segmentation.

        '
      example: ec702157-705b-42a0-b70e-a60a63dd24ab
      schema:
        type: string
        format: uuid
    AuthorizationParameter:
      in: header
      name: Authorization
      required: true
      description: 'OAuth2 Token (obtained from /oauth2/token )

        Reference: https://docs.indebted.co/docs/receive/integration/use-cases/authentication-use-case

        '
      example: Bearer <access_token>
      schema:
        type: string
    MinorVersionParameter:
      name: minorVersion
      in: query
      required: false
      description: Optional minor version identifier for message versioning. This value is passed as additional metadata with emitted messages.
      schema:
        type: string
    TriggerNameParameter:
      name: triggerName
      in: query
      required: false
      description: This is name of Custom Trigger that should be triggered when this API is called.
      schema:
        type: string
      example: customTrigger1
    AccountReferenceParameter:
      name: accountReference
      in: query
      required: true
      example: ACC
      description: Account reference in your system
      schema:
        type: string
  responses:
    403Forbidden:
      description: Access is denied
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Forbidden
    200SuccessRecreateClaims:
      description: Response of recreating a set of claims
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/RecreateClaims'
          example:
            INV-2024-0042:
              success: true
              messages:
              - Successfully recreated claim INV-2024-0042
              messageIds:
              - a1b2c3d4-0000-4a8b-9c6d-2e5f8a1b0c50
    500InternalError:
      description: Internal error occured
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Internal error
    200Success:
      description: Request was successful
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/ActionResponse'
          example:
            REFERENCE_1:
              success: true
              messages:
              - Successfully processed action
              messageIds:
              - e66d62ed-2331-4ced-8c03-5e729e984adc
    200SuccessGetDebtorAccountsAndClaims:
      description: Request for get_debtor_accounts_and_claims is successful
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/DebtorAccountsAndClaims'
          example:
          - accountReference: ACC-DE-5567
            currency: EUR
            meta:
              status: active
            debtors:
            - debtorReference: CUST-88213
              type: natural
              firstName: Anke
              lastName: Weber
              contactInformation:
                email: anke.weber@example.de
                country: DE
            claims:
            - claimReference: INV-2024-0042
              accountReference: ACC-DE-5567
              productReference: BROADBAND_PLAN_A
              amount: 30000
              totalFees: 2000
              currency: EUR
              currentDueDate: '2024-05-01'
              fees: []
    200SuccessCreateClaims:
      description: Response of creating a set of claims
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/CreateClaims'
          example:
            INV-2024-0042:
              success: true
              messages:
              - Successfully created claim INV-2024-0042
              messageIds:
              - 7f257450-808c-4689-805f-6119cd8580ea
    200SuccessCreditClaim:
      description: Response of Credit Claim
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/CreditClaimActionResponse'
          example:
            INV-2024-0042:
              success: true
              messages:
              - Successfully credited claim INV-2024-0042
              messageIds:
              - 3d9b7c2a-1f4e-4a8b-9c6d-2e5f8a1b0c4d
    200SuccessDebitClaim:
      description: Response of Debit Claim
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/DebitClaimActionResponse'
          example:
            INV-2024-0042:
              success: true
              messages:
              - Successfully debited claim INV-2024-0042
              messageIds:
              - 9c6d2e5f-8a1b-0c4d-3d9b-7c2a1f4e4a8b
    200SuccessGetAccountClaims:
      description: Request of get_account_claims is Successfull
      content:
        application/json:
          schema:
            oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ClaimResponse'
            - type: object
              properties:
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/ClaimResponse'
                limit:
                  type: integer
                  description: amount of claims per current page
                  example: 1000
                paginationId:
                  type: integer
                  description: pagination id to fetch the claims pagewise
                  example: 1
                numberOfPages:
                  type: integer
                  description: amount of pages with limit that is given for that request
                  example: 2
          examples:
            withoutPagination:
              summary: No limit set — all claims returned as a flat array
              value:
              - claimReference: INV-2024-0042
                accountReference: ACC-DE-5567
                amount: 149900
                currency: EUR
                status: active
                currentDueDate: '2024-05-01'
                originalDueDate: '2024-05-01'
                primaryDebtor:
                  debtorReference: CUST-88213
                  firstName: Anke
                  lastName: Weber
            withPagination:
              summary: limit set — claims wrapped in a paginated object
              description: Returned when the `limit` query param is present. Pass the returned `paginationId` back to fetch the next page.
              value:
                paginationId: 1
                numberOfPages: 2
                results:
                - claimReference: INV-2024-0042
                  accountReference: ACC-DE-5567
                  amount: 149900
                  currency: EUR
                  status: active
                  currentDueDate: '2024-05-01'
                  originalDueDate: '2024-05-01'
                  primaryDebtor:
                    debtorReference: CUST-88213
                    firstName: Anke
                    lastName: Weber
    401Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthorized
    400BadRequest:
      description: Incorrectly formed request
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 'Missing required request parameters: [Authorization]'
    429LimitsReached:
      description: Request was throttled
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Too Many Requests
  securitySchemes:
    api_key:
      type: apiKey
      name: Authorization
      in: header
