                  landLine:
                    type: string
                    description: Land Line Number
                    example: 495555555555
                    pattern: ^\+\d{1,3}\d{9,12}$
              - type: object
                required:
                  - workPhoneNumber
                additionalProperties: false
                properties:
                  workPhoneNumber:
                    type: string
