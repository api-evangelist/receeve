                `currency` are required
              required:
                - primaryDebtor
                - currency
              properties:
                primaryDebtor:
                  $ref: '#/components/schemas/Debtor'
            - type: object
              description: >-
                The `primaryDebtor` and the `currency` of the `Account` is used
                if not specified in the `Claim`
              required:
                - accountReference
