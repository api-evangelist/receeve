      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  $ref: '#/components/schemas/ClaimResponse'
              - type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClaimResponse'
                  limit:
                    type: integer
                    description: amount of claims per current page
                    example: 1000
                  paginationId:
