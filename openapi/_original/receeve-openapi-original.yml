                    firstName: Anke
                    lastName: Weber
            withPagination:
              summary: limit set — claims wrapped in a paginated object
              description: >-
                Returned when the `limit` query param is present. Pass the
                returned `paginationId` back to fetch the next page.
              value:
                paginationId: 1
                numberOfPages: 2
                results:
                  - claimReference: INV-2024-0042
                    accountReference: ACC-DE-5567
                    amount: 149900
                    currency: EUR
                    status: active
                    currentDueDate: '2024-05-01'
                    originalDueDate: '2024-05-01'
                    primaryDebtor:
