  /v1/{clientId}/update_claims:
    post:
      tags:
        - Claim
      summary: Update claims in the platform
      description: >
        The intetion of this endpoint is to update existing Claims in Receive.

        Notes:

        - This endpoint throws an error if the Claim does not exist.

        - The claims updated with this endpoint are not managed by the Ledger.
        To update Claims related with the Ledger, use the Ledger related API
        endpoints.

        - The payload is identical to other Claim related endpoints (like
        create_claims) but it can receive partial information, only the fields
        that are updated will be changed.

        For more details about the Claim, and the relationship with the other
        entities please visit the
        [Account](https://docs.indebted.co/docs/receive/integration/account-claims)
        page.
      operationId: updateClaims
      parameters:
        - $ref: '#/components/parameters/ClientIdParameter'
        - $ref: '#/components/parameters/AuthorizationParameter'
        - $ref: '#/components/parameters/TriggerNameParameter'
        - $ref: '#/components/parameters/SequentialParameter'
        - $ref: '#/components/parameters/AsyncParameter'
        - $ref: '#/components/parameters/MinorVersionParameter'
        - name: forceAmountCheck
