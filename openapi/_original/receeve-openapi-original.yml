components:
  schemas:
    AccountReference:
      type: string
      minLength: 1
      example: ACCOUNT_REFERENCE_002
      description: Account reference in your system
    PaymentReference:
      type: string
      minLength: 1
      example: paymentReference1
      description: >
        Payment reference used in online transactions.

        It is a text reference that can be used to map the money transactions to
        other external systems.
    ClaimResolutionReason:
      type: string
      enum:
        - CLAIM_SOLD
        - CLAIM_PAID
        - FRAUDULENT
        - CLAIM_DISCARDED
        - CLAIM_DISCHARGED
        - CLAIM_INVALIDATED
      example: CLAIM_PAID
      description: |
        The reason for the claim resolution.
    PortfolioReference:
      type: string
      minLength: 1
      example: EXTERNAL_PORTFOLIO_REFERENCE_002
      description: This is a optional grouping field for reporting purposes.
    ProductReference:
      type: string
      minLength: 1
      example: PRODUCT_REFERENCE_1
      description: >-
        Identifier for a product in your system. It is used for grouping
        purposes.
    DebtorReference:
      type: string
      minLength: 1
      example: EXTERNAL_DEBTOR_REF_002
      description: Your customer ID for this person or company
    Currency:
      type: string
      example: EUR
      pattern: ^[A-Z]{3}$
      description: 3-digit currency code (ISO 4217)
    Amount:
      minimum: 0
      type: integer
      example: 13025
      description: Monetary value in cents (natural nuumber)
    RelativeAmount:
      type: integer
      example: -13025
      description: Monetary value in cents (positive or negative number)
    DueDate:
      type: string
      format: date
      example: '2019-06-28'
      description: >-
        Current due date in your system. Use originalDueDate unless you
        purchased the debt and need this distinction.
    OriginalDueDate:
      type: string
      format: date
      example: '2019-06-28'
      description: >-
        Original due date in your system. This is the day when it went past due.
        DPD 0.
    Metadata:
      type: object
      description: Additional information related to the entity.
      example:
        sourceSystem: system1
    LedgerEntryReference:
      type: string
      example: INVOICE_LEDGER_ENTRY_REFERENCE_002
      description: Reference of the Ledger Entry (unique per Account)
    LedgerEntryCreatedAt:
      type: integer
      example: 1621536535901
      description: Timestamp when the ledger entry was created in milliseconds
    EntityWithAccountReference:
      type: object
      description: >-
        Schema definition used in composition with other Entities, that have a
        reference to an Account
      required:
        - accountReference
      properties:
        accountReference:
          $ref: '#/components/schemas/AccountReference'
      example:
        accountReference: ACCOUNT_REFERENCE_002
    Fee:
      type: object
      description: Additional expected payment amount.
      required:
        - name
        - amount
      properties:
        name:
          type: string
          minLength: 1
          description: >-
            Fee bucket name. `debit_claims` and `credit_claims` merge fees by
            exact name: the same name adjusts the existing bucket, on debit an
            unknown name creates a new bucket, and on credit an unknown name is
            silently ignored. Renaming a bucket mid-lifecycle fragments its
            history. Recommended canonical names: `interest`, `defaultInterest`,
            `lateFee`, `dunningFee`, `collectionCosts`, `repossessionCosts`. Any
            non-empty string is accepted.
          example: interest
        amount:
          $ref: '#/components/schemas/Amount'
    Account:
      type: object
      description: >-
        A formal business arrangement providing for regular dealings or services
        (such as banking, advertising, or store credit) and involving the
        establishment and maintenance of an Account.
      properties:
        meta:
          $ref: '#/components/schemas/Metadata'
        paymentReference:
          $ref: '#/components/schemas/PaymentReference'
        portfolioReference:
          $ref: '#/components/schemas/PortfolioReference'
        currency:
          $ref: '#/components/schemas/Currency'
        scores:
          type: array
          description: List of provided scores related with the Account.
          items:
            $ref: '#/components/schemas/AccountScore'
        debtors:
          type: array
          description: List of debtors related with the Account.
          items:
            $ref: '#/components/schemas/Debtor'
        products:
          type: array
          description: List of products related with the Account.
          items:
            $ref: '#/components/schemas/Product'
        ledgerEntries:
          type: array
          description: Ledger used to create Managed Claims.
          items:
            $ref: '#/components/schemas/LedgerEntry'
      example:
        currency: EUR
        paymentReference: paymentReference1
        meta:
          invoiceExternalNumber: 111
        scores:
          - type: INTERNAL
            value: V1
        debtors:
          - lastName: LAST_NAME_1
            firstName: FIRST_NAME_1
            debtorReference: EXTERNAL_DEBTOR_REF_001
            contactInformation:
              country: DE
              email: first.last@acme.com
        products:
          - productReference: PRODUCT_REFERENCE_1
            paymentReference: PRODUCT_PAYMENT_REFERENCE_1
          - productReference: PRODUCT_REFERENCE_2
            paymentReference: PRODUCT_PAYMENT_REFERENCE_2
        ledgerEntries:
          - ledgerEntryReference: INVOICE_LEDGER_ENTRY_REFERENCE_002_1
            invoiceDetails:
              amount: 100000
              dueDate: '2022-01-08'
              paymentReference: INVOICE_PAYMENT_REFERENCE_1
            context:
              productReference: PRODUCT_REFERENCE_1
    Debtor:
      description: >
        The Debtor is the entity that owes the money. It can be a person
        (natural) or a company (legal).

        Notes:

        - If the debtor is a person (natural), then firstName and lastName are
        required.

        - If the debtor is a company (legal), then companyName is required.
      allOf:
        - $ref: '#/components/schemas/BaseDebtor'
        - type: object
          required:
            - debtorReference
            - contactInformation
          properties:
            contactInformation:
              $ref: '#/components/schemas/ContactInformation'
    ContactInformation:
      description: |
        Contact information of the debtor, used for communication purposes.
      allOf:
        - $ref: '#/components/schemas/BaseContactInformation'
        - type: object
          required:
            - country
    BaseContactInformation:
      type: object
      properties:
        country:
          type: string
          example: DE
          pattern: ^[A-Z]{2}$
          description: >-
            2-digit country code (ISO 3166-1). This is required for the
            localization and payment providers.
        city:
          type: string
          minLength: 1
          example: Delbrück
          description: City
        mobileNumber:
          type: string
          example: 495555555555
          description: Mobile Number
          pattern: ^\+\d{1,3}\d{9,12}$
        postalCode:
          type: string
          example: 33129
          minLength: 1
          description: Postal Code
        houseNumber:
          type: string
          minLength: 1
          example: 24A
          description: House number as part of the address
        addressLine1:
          type: string
          example: Boikweg 24
          minLength: 1
          description: Address Line 1
        addressLine2:
          type: string
