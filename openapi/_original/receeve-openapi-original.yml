          properties:
            movements:
              type: array
              description: >-
                Optional per-entry breakdown of the credit/debit movements
                behind this claim import. Emit-only classification, not state:
                the `amount` you send remains the source of truth for the claim
                balance — movements are never used to recompute it. When
                present, Receive emits one typed credited/debited event per
                movement instead of a single net event; you are responsible for
                keeping `amount` consistent with the movements you send. Absent
                -> behaviour identical to today.
              items:
                $ref: '#/components/schemas/Movement'
