                  reactivate a resolved claim
                description: >-
                  A debit against a RESOLVED claim restores the balance but
                  leaves the claim RESOLVED. Set `options.forceAmountCheck:
                  true` to recompute the status from the resulting balance,
                  reactivating the claim (and clearing its resolution reason) in
                  the same call.
                value:
