    ActionResponse:
      type: object
      description: >-
        Response of any action that causes any side effect in the platform (e.g.
        create, update, delete)
      required:
        - success
        - messages
        - messageIds
      properties:
        success:
          type: boolean
          example: false
          description: Status of the action
        messages:
          type: array
          items:
            type: string
            example: Successfully created claim claim1
            description: Human-friendly message about the action
        messageIds:
          type: array
          description: Identifier of the messages (used for tracing)
          items:
            type: string
            format: uuid
            example: 32638681-bb15-400d-acc8-15bf8e38661e
      example:
        success: true
        messages:
          - Successfully processed action
        messageIds:
          - e66d62ed-2331-4ced-8c03-5e729e984adc
    DataResponse:
      description: Response of any action that returns data
      allOf:
        - $ref: '#/components/schemas/ActionResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/Debtor'
                  - $ref: '#/components/schemas/Product'
                  - $ref: '#/components/schemas/LedgerEntry'
                  - $ref: '#/components/schemas/AccountScore'
                  - $ref: '#/components/schemas/AccountMandateInput'
                  - $ref: >-
                      #/components/schemas/UpdateAccountLedgerEntriesAmountsInput
      example:
        success: true
        messages:
          - Successfully processed action
        messageIds:
          - e66d62ed-2331-4ced-8c03-5e729e984adc
        data:
          - accountReference: ACCOUNT_REFERENCE_002
    DebtorResponse:
      allOf:
        - $ref: '#/components/schemas/ActionResponse'
