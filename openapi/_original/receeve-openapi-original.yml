        - api_key: []
  /v1/{clientId}/import_claims:
    post:
      tags:
        - Claim
      summary: Insert or Update Claims in the platform
      description: >
        The intetion of this endpoint is to create/update Claims in Receive.

        It will create a new Claim if the Claim does not exist, or update the
        existing Claim if it already exists (abstraction over the create_claims
        and update_claims endpoints).

        Notes:

        - The claims updated with this endpoint are not managed by the Ledger.
        To update Claims related with the Ledger, use the Ledger related API
        endpoints.

        - Notice that the payload is identical to other Claim related endpoints
        (like create_claims), and it requires the full Claim information in the
        payload, that will be used to upsert the Claim.

        For more details about the Claim, and the relationship with the other
        entities please visit the
        [Account](https://docs.indebted.co/docs/receive/integration/account-claims)
        page.
      operationId: importClaims
      parameters:
        - $ref: '#/components/parameters/ClientIdParameter'
        - $ref: '#/components/parameters/AuthorizationParameter'
        - $ref: '#/components/parameters/TriggerNameParameter'
        - $ref: '#/components/parameters/SequentialParameter'
        - $ref: '#/components/parameters/AsyncParameter'
        - $ref: '#/components/parameters/MinorVersionParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                A map of your claim references to claim payloads. Each key is
                YOUR reference for the claim (any string unique within your
                system) and is echoed back verbatim in the response so you can
                reconcile per-claim outcomes. Send several entries to upsert a
                batch in one call.
              additionalProperties:
                $ref: '#/components/schemas/ImportClaimInput'
            examples:
              newDebtorCreatesAccount:
                summary: >-
                  New overdue invoice — creates the Account and Claim in one
                  call
                description: >-
                  No `accountReference` is supplied, so the `anyOf` on the claim
                  requires `primaryDebtor` and `currency`. Receive creates the
                  Account and the Claim together. The map key `INV-2024-0042` is
                  your own reference and comes back unchanged in the response.
                value:
                  INV-2024-0042:
                    amount: 149900
                    currency: EUR
                    originalDueDate: '2024-05-01'
                    currentDueDate: '2024-05-01'
                    productReference: BROADBAND_PLAN_A
                    primaryDebtor:
                      debtorReference: CUST-88213
                      firstName: Anke
                      lastName: Weber
                      contactInformation:
                        email: anke.weber@example.de
                        country: DE
                        mobileNumber: '+491701234567'
              existingAccountWithFeesAndScore:
                summary: >-
                  Add to an existing Account, with fees, a risk score, and a
                  forced balance check
                description: >-
                  Targets an existing `accountReference`, so `primaryDebtor` and
                  `currency` are optional (inherited from the Account).
                  `forceAmountCheck: true` makes Receive reject the call if
                  `amount` does not equal ledger + fees — use it when you
                  compute the balance yourself and want the API to guard against
                  drift.
                value:
                  INV-2024-0043:
                    options:
                      forceAmountCheck: true
                    amount: 52000
                    totalFees: 2000
                    currency: EUR
                    originalDueDate: '2024-04-30'
                    currentDueDate: '2024-06-15'
                    accountReference: ACC-DE-5567
                    productReference: MOBILE_PLAN_M
                    fees:
                      - name: Late payment fee
                        amount: 2000
                    scores:
                      - type: INTERNAL
                        value: VERY_GOOD
                    primaryDebtor:
                      debtorReference: CUST-88214
                      firstName: Bernd
                      lastName: Fischer
                      contactInformation:
                        email: bernd.fischer@example.de
                        country: DE
              movementsBreakdown:
                summary: >-
                  Ledger-driven import with a per-movement credit/debit
                  breakdown
                description: >-
                  `movements` is emit-only classification, not state: `amount`
                  is still the source of truth for the claim balance and is NOT
                  recomputed from `movements`. When present, Receive emits one
                  typed credited/debited event per movement instead of a single
                  net event. You are responsible for keeping `amount` consistent
                  with the movements you send. Unknown `direction`/`type` values
                  are rejected with a 400.
                value:
                  INV-2024-0044:
                    amount: 47000
                    currency: EUR
                    originalDueDate: '2024-04-30'
                    currentDueDate: '2024-06-15'
                    accountReference: ACC-DE-5567
                    productReference: MOBILE_PLAN_M
                    movements:
                      - direction: DEBIT
                        type: INTEREST
                        amount: 2000
                        sourceRef: LEDGER-ENTRY-0042
                      - direction: CREDIT
                        type: PAYMENT
                        amount: 5000
                        sourceRef: LEDGER-ENTRY-0043
      responses:
        '200':
          description: >-
            A map keyed by the SAME claim references you sent. Each value
            reports that claim's outcome independently, so a batch can partially
            succeed — always inspect every entry's `success` flag.
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/ActionResponse'
              examples:
                newDebtorCreatesAccount:
                  summary: Response for the single-claim upsert
                  value:
                    INV-2024-0042:
                      success: true
                      messages:
                        - Successfully imported claim INV-2024-0042
                      messageIds:
                        - 7f257450-808c-4689-805f-6119cd8580ea
                existingAccountWithFeesAndScore:
                  summary: Response for the fees + score upsert
                  value:
                    INV-2024-0043:
                      success: true
                      messages:
                        - Successfully imported claim INV-2024-0043
                      messageIds:
                        - 3d9b7c2a-1f4e-4a8b-9c6d-2e5f8a1b0c4d
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429LimitsReached'
        '500':
          $ref: '#/components/responses/500InternalError'
      security:
        - api_key: []
  /v1/{clientId}/resolve_claims:
    post:
      tags:
        - Claim
      summary: Resolves Claims with a reason
      description: >
        The intetion of this endpoint is to resolve active Claims in Receive.

        Notes:

        - The claim state will change to resolved, but it will not affect other
        properties of the claim like the amount, due date, etc.

        - To resolve the claim and update the amount to zero, please use the
        update_claims endpoint with the reason CLAIM_PAID as described in the
        Integration Documentation.

        For more details about the Claim, and the relationship with the other
        entities please visit the
        [Account](https://docs.indebted.co/docs/receive/integration/account-claims)
        page.
      operationId: resolveClaims
      parameters:
        - $ref: '#/components/parameters/ClientIdParameter'
        - $ref: '#/components/parameters/AuthorizationParameter'
        - $ref: '#/components/parameters/TriggerNameParameter'
        - $ref: '#/components/parameters/SequentialParameter'
        - $ref: '#/components/parameters/AsyncParameter'
        - $ref: '#/components/parameters/MinorVersionParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  ref:
                    type: string
                    example: CLAIM_REF_002
                  reason:
                    $ref: '#/components/schemas/ClaimResolutionReason'
            examples:
              resolvePaid:
                summary: Resolve a single claim that was paid in full
                description: >-
                  Marks the claim resolved with reason CLAIM_PAID. Resolution
                  changes state only — it does NOT zero the balance; use
                  update_claims for that. reason is one of CLAIM_SOLD,
                  CLAIM_PAID, FRAUDULENT, CLAIM_DISCARDED, CLAIM_DISCHARGED,
                  CLAIM_INVALIDATED.
                value:
                  - ref: INV-2024-0042
                    reason: CLAIM_PAID
              resolveBatch:
                summary: Resolve several claims with different reasons
                value:
                  - ref: INV-2024-0042
                    reason: CLAIM_PAID
                  - ref: INV-2024-0043
                    reason: CLAIM_SOLD
      responses:
        '200':
          $ref: '#/components/responses/200Success'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429LimitsReached'
        '500':
          $ref: '#/components/responses/500InternalError'
      security:
        - api_key: []
  /v1/{clientId}/credit_claims:
    post:
      tags:
        - Claim
      summary: Credit claims
      description: >
        The intention of this endpoint is to credit claims in Receive.

        Notes:
          - Crediting the claim will decrease the amount of the claim.
          - If the claim amount is zero, the claim will be resolved.
          - When you provide fees as a number, it will reduce totalFees of the claim
          - When you provide fees as an array, we check
            - if a fee with same name already exists for the claim, if so, we substract incoming fee amount from existing fee amount and subtract fee.amount from totalFees of the claim
            - if a fee with same name does not exist, we ignore it
          - if you want to credit to fees only, set amount to 0.
          - if you want to credit to fees first, and then remaining amount to claim amount, do not send `fees` field (send `amount` only)
        For more details about the Claim, and the relationship with the other
        entities please visit the
        [Account](https://docs.indebted.co/docs/receive/integration/account-claims)
        page.
      operationId: creditClaims
      parameters:
        - $ref: '#/components/parameters/ClientIdParameter'
        - $ref: '#/components/parameters/AuthorizationParameter'
        - $ref: '#/components/parameters/TriggerNameParameter'
        - $ref: '#/components/parameters/SequentialParameter'
        - $ref: '#/components/parameters/AsyncParameter'
        - $ref: '#/components/parameters/MinorVersionParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: claimReference as key and CreditClaimInput object as value
              additionalProperties:
                $ref: '#/components/schemas/CreditClaimInput'
              example:
                API_CLAIM_REF_002_1:
                  amount: 1000
                  currency: EUR
                  originator: DCA
                  date: 1647526514000
                  descriptionText: The claim received a partial payment through the DCA
                  paymentDistributionPriority: AMOUNT_FIRST
                API_CLAIM_REF_002_2:
                  amount: 1000
                  fees: 500
                  currency: EUR
                  originator: DCA
                  date: 1647526514000
                  descriptionText: The claim received a partial payment through the DCA
                  paymentDistributionPriority: AMOUNT_FIRST
                API_CLAIM_REF_002_3:
                  amount: 1000
                  fees:
                    - name: Processing Fee
                      amount: 25
                    - name: Late Fee
                      amount: 15
                  currency: EUR
                  originator: DCA
                  date: 1647526514000
                  descriptionText: The claim received a partial payment through the DCA
                  paymentDistributionPriority: AMOUNT_FIRST
      responses:
        '200':
          $ref: '#/components/responses/200SuccessCreditClaim'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429LimitsReached'
        '500':
          $ref: '#/components/responses/500InternalError'
      security:
        - api_key: []
  /v1/{clientId}/debit_claims:
    post:
      tags:
        - Claim
      summary: Debit claims
      description: >
        The intention of this endpoint is to debit claims in Receive.

        Notes:
          - Debiting the claim will increase the amount and/or totalFees of the claim.
          - When you provide fees as a number, it will be added to the totalFees of the claim
          - When you provide fees as an array, we check
            - if a fee with same name already exists for the claim, if so, we add incoming fee amount to existing fee amount and add fee.amount to totalFees of the claim
            - if a fee with same name does not exist, we create a new fee with the provided name and add fee.amount to totalFees of the claim
          - if you want to debit to fees only, set amount to 0.
        For more details about the Claim, and the relationship with the other
        entities please visit the
        [Account](https://docs.indebted.co/docs/receive/integration/account-claims)
        page.
      operationId: debitClaims
      parameters:
        - $ref: '#/components/parameters/ClientIdParameter'
        - $ref: '#/components/parameters/AuthorizationParameter'
        - $ref: '#/components/parameters/TriggerNameParameter'
        - $ref: '#/components/parameters/SequentialParameter'
        - $ref: '#/components/parameters/AsyncParameter'
        - $ref: '#/components/parameters/MinorVersionParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
