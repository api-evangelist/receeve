          type: string
          description: This is the orderID or other identifier from the payment provider
          example: 3889445415
        totalAmount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        paymentReference:
          $ref: '#/components/schemas/PaymentReference'
        meta:
          type: object
          description: Additional information related to the transaction
        context:
          type: object
          additionalProperties: false
          description: Context used to do the matching of the payment
          properties:
            productReference:
              $ref: '#/components/schemas/ProductReference'
            feeLedgerEntriesOrder:
              type: array
              description: >-
                Order of fee ledger entry types used for the payment priority
                (only for CUSTOM_ORDERED_FEES, ignored otherwise)
              items:
                type: string
        matchStrategy:
          type: string
          enum:
            - ORDERED_LEDGER_ENTRIES
            - ORDERED_INVOICES_WITH_FEES_THEN_ACCOUNT_ENTRIES
            - ACCOUNT_ENTRIES_THEN_ORDERED_INVOICES_WITH_FEES
            - CUSTOM_ORDERED_FEES
