  /v1/{clientId}/create_claims:
    post:
      tags:
        - Claim
      summary: Create claims in Receive
      description: >
        The intetion of this endpoint is to create Claims in Receive.

        Notes:

        - This endpoint throws an error if the Claim already exists (even if it
        was deleted).

        - The claims created with this endpoint are not managed by the Ledger.

        For more details about the Claim, and the relationship with the other
        entities please visit the
        [Account](https://docs.indebted.co/docs/receive/integration/account-claims)
        page.
      operationId: createClaims
      parameters:
        - $ref: '#/components/parameters/ClientIdParameter'
        - $ref: '#/components/parameters/AuthorizationParameter'
        - $ref: '#/components/parameters/TriggerNameParameter'
        - $ref: '#/components/parameters/SequentialParameter'
        - $ref: '#/components/parameters/AsyncParameter'
        - $ref: '#/components/parameters/MinorVersionParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: ClaimReference as key and the Claim as value
              additionalProperties:
                $ref: '#/components/schemas/CreateClaimInput'
            examples:
              singleClaim:
                summary: One claim on a new account
                description: >-
                  Minimal create for a debtor not yet in Receive. The map key
                  (INV-2024-0042) is your own reference and is echoed back
                  verbatim in the response so you can reconcile per claim.
                value:
                  INV-2024-0042:
                    amount: 149900
                    currency: EUR
                    currentDueDate: '2024-05-01'
                    originalDueDate: '2024-05-01'
                    productReference: BROADBAND_PLAN_A
                    accountReference: ACC-DE-5567
                    totalFees: 0
                    primaryDebtor:
                      debtorReference: CUST-88213
                      firstName: Anke
                      lastName: Weber
                      contactInformation:
                        email: anke.weber@example.de
                        country: DE
              batchTwoClaims:
                summary: Several claims in one request
                description: >-
                  Add more keys to the map to upsert a batch. Each claim is
                  processed independently and reported separately, so a batch
                  can partially succeed.
                value:
                  INV-2024-0042:
                    amount: 149900
                    currency: EUR
                    currentDueDate: '2024-05-01'
                    originalDueDate: '2024-05-01'
                    accountReference: ACC-DE-5567
                    primaryDebtor:
                      debtorReference: CUST-88213
                      firstName: Anke
                      lastName: Weber
                      contactInformation:
                        email: anke.weber@example.de
                        country: DE
                  INV-2024-0043:
                    amount: 52000
                    currency: EUR
                    currentDueDate: '2024-06-15'
                    originalDueDate: '2024-04-30'
                    accountReference: ACC-DE-5568
                    primaryDebtor:
                      debtorReference: CUST-88214
                      firstName: Bernd
                      lastName: Fischer
                      contactInformation:
                        email: bernd.fischer@example.de
                        country: DE
              consolidatedClaim:
                summary: Consolidated claim replacing instalment claims (acceleration)
                description: >-
                  After accelerating a loan, credit the individual instalment
                  claims and place one claim for the enforceable balance.
                  relatedClaims keeps the consolidation lineage queryable — it
                  is metadata only; Receive does not resolve or modify the
                  referenced claims.
                value:
                  LOAN-2093-ACCEL:
                    amount: 390000
                    currency: EUR
                    currentDueDate: '2024-07-15'
                    originalDueDate: '2024-07-15'
                    accountReference: ACC-DE-5569
                    productReference: LOAN-2093
                    relatedClaims:
                      - type: REPLACES
                        claimReference: LOAN-2093-INST-07
                      - type: REPLACES
                        claimReference: LOAN-2093-INST-08
                      - type: REPLACES
                        claimReference: LOAN-2093-INST-09
                    primaryDebtor:
                      debtorReference: CUST-88215
                      firstName: Carlos
                      lastName: Norte
                      contactInformation:
                        email: carlos.norte@example.de
                        country: DE
      responses:
        '200':
          $ref: '#/components/responses/200SuccessCreateClaims'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429LimitsReached'
        '500':
          $ref: '#/components/responses/500InternalError'
      security:
        - api_key: []
  /v1/{clientId}/recreate_claims:
