            data:
              $ref: '#/components/schemas/DebitClaimInput'
    CreditClaimInput:
      type: object
      required:
        - amount
        - currency
        - originator
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        fees:
          oneOf:
            - type: number
              description: Fees as a numeric value
            - type: array
              items:
                $ref: '#/components/schemas/Fee'
              description: Array of Fee objects with name and amount
          description: Fees for the credit claim, can be a number or array of Fee objects
        currency:
          $ref: '#/components/schemas/Currency'
        originator:
          type: string
          enum:
            - DCA
            - CLIENT
        paymentDistributionPriority:
          type: string
          enum:
            - FEES_FIRST
            - AMOUNT_FIRST
          description: >-
            Defines the priority for payment distribution (whethere the payment
            amount should be distributed to claim's principal amount first or to
            claim's fees first)
        creditType:
          type: string
          enum:
            - PAYMENT
            - DISCOUNT
            - ADJUSTMENT
          description: >-
            Typed classification of the credit, mirroring the ledger entry
            types. Omitted implies PAYMENT (today's implicit semantics).
        date:
          type: number
          description: date of credit (unix timestamp in msec)
          example: 1647526514000
        descriptionText:
          type: string
          description: some description for credit
        context:
          type: object
          description: >
            Optional free-form context forwarded to the claim credit event.

            Up to 10 key-value pairs. Values may be string, number, boolean, or
            null.
          maxProperties: 10
          additionalProperties:
            nullable: true
            oneOf:
              - type: string
              - type: number
              - type: boolean
    DebitClaimInput:
      type: object
      required:
        - amount
        - currency
        - originator
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        fees:
          oneOf:
            - type: number
              description: Fees as a numeric value
            - type: array
              items:
                $ref: '#/components/schemas/Fee'
              description: Array of Fee objects with name and amount
          description: Fees for the debit claim, can be a number or array of Fee objects
        currency:
          $ref: '#/components/schemas/Currency'
        originator:
          type: string
          enum:
            - DCA
            - CLIENT
        debitType:
          type: string
          enum:
            - ADJUSTMENT
            - CHARGEBACK
            - INTEREST
          description: >-
            Typed classification of the debit, mirroring the ledger entry types.
            Optional with no default.
        date:
          type: number
          description: date of debit (unix timestamp in msec)
          example: 1647526514000
        descriptionText:
          type: string
          description: some description for debit
        context:
          type: object
          description: >
            Optional free-form context forwarded to the claim debit event.

            Up to 10 key-value pairs. Values may be string, number, boolean, or
            null.
          maxProperties: 10
          additionalProperties:
            nullable: true
            oneOf:
              - type: string
              - type: number
              - type: boolean
        options:
          type: object
          additionalProperties: false
          description: Debit options
          properties:
            forceAmountCheck:
              type: boolean
              example: false
              description: >-
                Recompute the claim status from the resulting balance. Use on
                payment reversals (chargebacks): a debit against a RESOLVED
                claim restores the balance but does NOT reactivate it unless
                this flag is set.
    CommunicationMessageURL:
      type: object
      required:
        - communicationType
        - messageURL
        - dateTime
        - bundleId
        - bundleName
      properties:
        communicationType:
          type: string
          enum:
            - email
            - letter
            - SMS
          description: type of communication that happened in Receive system
          example: email
        messageURL:
          type: string
          pattern: ^\/(.+.eml)$
          description: URL of the message
          example: /Operations/email/Message/3b97bd7a-1c07-44d4-b33f-2250f6419e95.eml
        dateTime:
          type: integer
          description: Timestamp when the communication event occured
          example: 1621536535901
        bundleId:
          type: string
          format: uuid
          description: template id of communication that happened in Receive system
          example: 00000000-0000-0000-0000-000000000000
        bundleName:
          type: string
          description: >-
            template display name of communication that happened in Receive
            system
          example: Default Email Template
