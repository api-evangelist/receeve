      description: >
        The intetion of this endpoint is to recreate Claims in Receive.

        Notes:

        - This endpoint throws an error if the Claim is not deleted.

        - The claims created with this endpoint are not managed by the Ledger.

        - Recreating the claim will restart the claim lifecycle and the other
        related entities, this is specially important for the Collections
        Strategy, that will start from the beginning.

        For more details about the Claim, and the relationship with the other
