                    pattern: ^\+\d{1,3}\d{9,12}$
    BaseDebtor:
      type: object
      properties:
        birthday:
          type: string
          format: date
          example: '1980-06-28'
          description: Birthday of the debtor
        gender:
          type: string
          example: M
          pattern: ^(M|F)$
          description: Gender of the debtor
        firstName:
          type: string
          example: John
          minLength: 1
          description: First name of the debtor (required if type is 'natural')
        lastName:
          type: string
          example: White
          minLength: 1
          description: Last name of the debtor (required if type is 'natural')
        middleName:
          type: string
          example: Benedict
          minLength: 1
          description: Middle name of the debtor
        title:
          type: string
          minLength: 1
          example: Doctor
          description: Title of the debtor
        companyName:
          type: string
          minLength: 1
          example: Acme Brick Co.
          description: Company Name of the debtor (required if type is 'legal')
        debtorReference:
          $ref: '#/components/schemas/DebtorReference'
        SSN:
          type: string
          example: AAA-GG-SSSS
          description: National Identification Number of the debtor
        type:
          type: string
          example: natural
          enum:
            - natural
            - legal
          description: 'Type of the debtor (default: natural)'
        contactInformation:
          $ref: '#/components/schemas/BaseContactInformation'
    Product:
      type: object
      description: >-
        A product is a service or item used to give context to the Claim or
        Ledger Entry
      required:
        - productReference
      properties:
        productReference:
          $ref: '#/components/schemas/ProductReference'
        paymentReference:
          $ref: '#/components/schemas/PaymentReference'
        type:
          type: string
          minLength: 1
          example: Computer
          description: Type of product
        name:
          type: string
          minLength: 1
          example: Macbook Pro
          description: Product name
        code:
          type: string
          minLength: 1
          example: 111-22222-3333
          description: Product code
        meta:
          $ref: '#/components/schemas/Metadata'
    BaseClaim:
      type: object
      description: >-
        A claim is an outstanding payment that is owed. You can always update
        this balance if multiple payments are missed and you want to aggregate
        the amounts.
      minProperties: 1
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        product:
          $ref: '#/components/schemas/Product'
        portfolioReference:
          $ref: '#/components/schemas/PortfolioReference'
        productReference:
          $ref: '#/components/schemas/ProductReference'
        creditorReference:
          type: string
          minLength: 1
          description: Reference of the person/company to whom money is owed
        totalFees:
          $ref: '#/components/schemas/Amount'
        currentDueDate:
          $ref: '#/components/schemas/DueDate'
        originalDueDate:
          $ref: '#/components/schemas/OriginalDueDate'
        scores:
          type: array
          description: List of scores
          items:
            $ref: '#/components/schemas/ClaimScore'
        reason:
          type: string
          minLength: 1
          deprecated: true
          description: >-
            Reason for updating a claim (the reason must not be part of the
            Entity)
        paymentReference:
          $ref: '#/components/schemas/PaymentReference'
        accountNumber:
          allOf:
            - $ref: '#/components/schemas/AccountReference'
            - minLength: 1
              deprecated: true
              description: Account number in your system (DEPRECATED, use accountReference)
        accountReference:
          $ref: '#/components/schemas/AccountReference'
        meta:
          $ref: '#/components/schemas/Metadata'
        fees:
          type: array
          description: >-
            List of fees. If neither fees nor totalFees are provided - we treat
            totalFees as 0. Using this field overwrites the totalFees value if
            you provided it as well.
          items:
            $ref: '#/components/schemas/Fee'
        linkGroupId:
          description: >
            Shared-liability group identifier. Claims sharing a linkGroupId are
            synced mirrors of the same underlying debt: whenever one claim in
            the group is updated via cmd.linkedClaims.sync, the fields amount,
            totalFees, and fees are overwritten on every other claim in the
            group. Use this field only for shared-liability scenarios (e.g.
            co-debtors or guarantors each holding a separate account for the
            same debt). Do NOT use it to group related-but-independent claims
            such as instalments of a single purchase — doing so would cause
            every instalment's amount to overwrite the others'.
          type: string
          format: uuid
          nullable: true
        origination:
          $ref: '#/components/schemas/ClaimOrigination'
        repaymentsHistory:
          type: array
          description: Pre-sale payment history for the claim
          items:
            $ref: '#/components/schemas/Repayment'
        relatedClaims:
          type: array
          description: >-
            Typed relations from this claim to other claims. Lineage metadata
            only — the platform does not act on it. Use it to keep consolidation
            history queryable, e.g. an accelerated claim declaring which
            instalment claims it replaces.
          items:
            $ref: '#/components/schemas/RelatedClaim'
        primaryDebtor:
          $ref: '#/components/schemas/BaseDebtor'
    RelatedClaim:
      type: object
      description: >-
        A typed relation from this claim to another claim (lineage metadata; the
        platform does not act on it)
      required:
        - type
        - claimReference
      additionalProperties: false
      properties:
        type:
          type: string
          description: >-
            Relation type, declared on THIS claim pointing at the referenced
            claim (single direction; inverses are derived at query time).
            REPLACES: this claim supersedes the referenced ones (e.g. a
            consolidated claim placed at acceleration after crediting the
            individual instalment claims). SPLIT_FROM: this claim was split out
            of the referenced claim (e.g. the disputed portion of an invoice
            separated for independent handling). REINSTATES: this claim places
            debt back into collection after the referenced claim was already
            resolved (e.g. a settlement breached after the original claim was
            closed). REFINANCES: this claim is a new credit agreement curing the
            referenced claims under new terms — counts as recovery.
            RESTRUCTURES: this claim re-schedules the referenced debt by
            agreement with the debtor (workout/forbearance executed in your core
            system and placed as a new claim — restructures executed inside
            Receive use an Instalment Plan instead; do not create a new claim
            for those). DEFERS: this fee claim gates a due-date deferral of the
            referenced claims.
          enum:
            - REPLACES
            - SPLIT_FROM
            - REINSTATES
            - REFINANCES
            - RESTRUCTURES
            - DEFERS
        claimReference:
          type: string
          minLength: 1
          description: Your reference of the related claim
          example: API_CLAIM_REF_INST_001
    Movement:
      type: object
      description: >-
        A single credit/debit movement contributing to a claim import. Emit-only
        classification, not state: movements never drive the claim `amount` —
        they only determine which typed credited/debited events Receive emits.
      required:
        - direction
        - amount
      additionalProperties: false
      properties:
        direction:
          type: string
          enum:
            - CREDIT
            - DEBIT
          description: >-
            Whether the movement decreases (CREDIT) or increases (DEBIT) the
            outstanding claim amount
        amount:
          type: integer
          minimum: 0
          description: The movement amount [cents]
          example: 5000
        type:
          type: string
          enum:
            - PAYMENT
            - DISCOUNT
            - ADJUSTMENT
            - CHARGEBACK
            - INTEREST
          description: >-
            Typed classification of the movement, reusing the claim credit/debit
            vocabulary: PAYMENT, DISCOUNT, or ADJUSTMENT for a CREDIT;
            ADJUSTMENT, CHARGEBACK, or INTEREST for a DEBIT.
        sourceRef:
          type: string
          minLength: 1
          description: >-
            Opaque reference correlating this movement to the record that
            produced it (e.g. a ledger entry reference). Passed through
            verbatim; never interpreted by Receive.
          example: LEDGER-ENTRY-0001
    Claim:
