  /finance/v1/{clientId}/compute_instalment_plan_definition:
    post:
      tags:
        - Finance Instalments V2
      summary: Compute Instalment Plan Definition
      description: >
        Dynamic wizard for generating computed instalment plan definitions.
        Returns different 

        types based on computation results (programmatic, choice, fixedAmounts,
        percentageAmounts, null).


        Each definition expects different `formData`, so there is no single
        fixed request schema —

        send the fields that definition requires. Compute is iterative: call it
        repeatedly, feeding

        each result forward, until it returns a final state. Then pass the `id`
        from that last

        compute response to create_instalment_plan.
      operationId: computeInstalmentPlanDefinition
      parameters:
        - $ref: '#/components/parameters/ClientIdParameter'
        - $ref: '#/components/parameters/AuthorizationParameter'
        - $ref: '#/components/parameters/TriggerNameParameter'
        - $ref: '#/components/parameters/AsyncParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputeInstalmentPlanDefinitionInput'
            example:
              instalmentPlanDefinitionId: STANDARD_6M
              accountReference: ACC-DE-5567
              externalClaimReferences:
                - INV-2024-0042
              formData: {}
      responses:
        '200':
          description: >-
            Successfully computed instalment plan definition (polymorphic
            response based on computation type)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeInstalmentPlanDefinitions'
              example:
                success: true
                messageIds:
                  - a1b2c3d4-0000-4a8b-9c6d-2e5f8a1b0c48
                messages:
                  - Successfully computed instalment plan definition
                data:
                  id: 3824e25a-e29d-4fbf-ac85-fac012912740
                  type: programmatic
                  version: 1
                  final: true
                  enabled: true
                  selectable: false
                  accountId: ACC-DE-5567
                  computedAt: '2024-05-01T10:00:00.000Z'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429LimitsReached'
        '500':
          $ref: '#/components/responses/500InternalError'
      security:
        - api_key: []
