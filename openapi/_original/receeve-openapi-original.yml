  parameters:
    ClientIdParameter:
      name: clientId
      in: path
      required: true
      description: >
        A Receive system identifier that will be assigned automatically.

        It will be used for situations like Support related interventions or
        data segmentation.
      example: ec702157-705b-42a0-b70e-a60a63dd24ab
      schema:
        type: string
        format: uuid
    AuthorizationParameter:
      in: header
      name: Authorization
      required: true
      description: >
        OAuth2 Token (obtained from /oauth2/token )

        Reference:
        https://docs.indebted.co/docs/receive/integration/use-cases/authentication-use-case
      example: Bearer <access_token>
      schema:
        type: string
    AccountReferenceParameter:
      name: accountReference
      in: query
      required: true
      example: ACC
      description: Account reference in your system
      schema:
        type: string
    ClaimReferenceParameter:
      name: claimReference
      in: query
      required: true
      example: ACCOUNT_REFERENCE_002
      description: Receive Claim Reference
      schema:
        type: string
        minLength: 1
    TriggerNameParameter:
      name: triggerName
      in: query
      required: false
      description: >-
        This is name of Custom Trigger that should be triggered when this API is
        called.
      schema:
        type: string
      example: customTrigger1
    AsyncParameter:
      name: async
      in: query
      required: false
      description: The request is added to the queue without expecting the response
      schema:
        type: boolean
    SequentialParameter:
      name: sequential
      in: query
      required: false
      description: The request body items are executed one after another one
      schema:
        type: boolean
    MinorVersionParameter:
      name: minorVersion
      in: query
      required: false
      description: >-
        Optional minor version identifier for message versioning. This value is
        passed as additional metadata with emitted messages.
      schema:
        type: string
  securitySchemes:
    api_key:
      type: apiKey
      name: Authorization
      in: header
