  /v1/{clientId}/set_link_claims:
    post:
      tags:
        - Claim
      summary: Set link claims
      description: >
        Links claims into a shared-liability group or breaks existing links.


        **What linking does:** Claims in the same link group become synced
        mirrors of the same underlying debt. Whenever any claim in the group is
        updated, the platform overwrites the `amount`, `totalFees`, and `fees`
        fields on every other claim in the group via `cmd.linkedClaims.sync`.
        This means all linked claims always reflect the same balance.


        **Intended use case — shared liability only:** Use linking when multiple
        accounts (e.g. co-debtors or guarantors) each hold a separate claim
        representing the same debt. Linking keeps their balances in sync
        automatically.


        **Do NOT use for instalments or independent claims:** Linking
        instalments of a single purchase, or any set of claims with different
        individual balances, will cause every claim's amount to overwrite the
        others', corrupting all balances in the group.


        Notes:
          - Provide a mapping of external claim references to other claim references to link them
          - Use null as the value to unlink a claim

        For more details about the Claim, and the relationship with the other
        entities please visit the
        [Account](https://docs.indebted.co/docs/receive/integration/account-claims)
        page.
      operationId: setLinkClaims
      parameters:
        - $ref: '#/components/parameters/ClientIdParameter'
        - $ref: '#/components/parameters/AuthorizationParameter'
        - $ref: '#/components/parameters/TriggerNameParameter'
        - $ref: '#/components/parameters/AsyncParameter'
        - $ref: '#/components/parameters/MinorVersionParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                External claim reference as key and target claim reference (or
                null to unlink) as value
              additionalProperties:
                type: string
                nullable: true
              example:
                API_CLAIM_REF_002: API_CLAIM_REF_001
                API_CLAIM_REF_003: API_CLAIM_REF_001
      responses:
        '200':
          $ref: '#/components/responses/200Success'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429LimitsReached'
        '500':
          $ref: '#/components/responses/500InternalError'
      security:
        - api_key: []
