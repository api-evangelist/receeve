        - type: object
          properties:
            data:
              oneOf:
                - $ref: >-
                    #/components/schemas/ComputedInstalmentPlanDefinitionProgrammaticV2
                - $ref: >-
                    #/components/schemas/ComputedInstalmentPlanDefinitionChoiceV2
                - $ref: >-
                    #/components/schemas/ComputedInstalmentPlanDefinitionFixedAmountsV2
                - $ref: >-
                    #/components/schemas/ComputedInstalmentPlanDefinitionPercentageAmountsV2
                - $ref: '#/components/schemas/ComputedInstalmentPlanDefinitionNullV2'
    SettlementDiscount:
      description: The discount rule a settlement applies.
      oneOf:
        - type: object
          required:
            - type
            - percentage
          properties:
            type:
              type: string
              enum:
                - PERCENTAGE
            percentage:
              type: number
              minimum: 0
              maximum: 100
        - type: object
          required:
            - type
            - amount
          properties:
            type:
              type: string
              enum:
                - FIXED
            amount:
              type: integer
              description: Fixed discount amount in minor units (cents)
        - type: object
          required:
            - type
            - script
          properties:
            type:
              type: string
              enum:
                - PROGRAMMATIC
            script:
              type: string
            form:
              type: object
              additionalProperties: true
    SettlementSelector:
      description: What the settlement definition materialises against.
      oneOf:
        - type: object
          required:
            - type
            - promiseToPayId
          properties:
            type:
              type: string
              enum:
                - PROMISE_TO_PAY_INSTANCE
            promiseToPayId:
              type: string
        - type: object
          required:
            - type
            - instalmentPlanDefinitionIds
          properties:
            type:
              type: string
              enum:
                - INSTALMENT_PLAN_DEFINITION
            instalmentPlanDefinitionIds:
              type: array
              items:
                type: string
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - DIRECT
    SettlementDefinitionInput:
      type: object
      required:
        - id
        - version
        - discount
        - selector
        - enabled
      properties:
        id:
          type: string
          description: Client-provided identifier of the settlement definition
        version:
          type: integer
          minimum: 1
          description: Monotonic version of the definition
        discount:
          $ref: '#/components/schemas/SettlementDiscount'
        selector:
          $ref: '#/components/schemas/SettlementSelector'
        guards:
          type: object
          properties:
            maxDiscountPercentage:
              type: number
        enabled:
          type: boolean
    ApplySettlementInput:
      type: object
      required:
        - definitionId
        - accountReference
        - externalClaimRefs
        - applicationRef
      properties:
        definitionId:
          type: string
          description: Identifier of the DIRECT settlement definition to apply
        accountReference:
          type: string
          description: Account reference identifier
        externalClaimRefs:
          type: array
          minItems: 1
          items:
            type: string
          description: Client claim references the settlement is applied to
        applicationRef:
          type: string
          description: Idempotency key for this application
        form:
          type: object
          additionalProperties: true
          description: Form data for programmatic discounts
    WithdrawSettlementInput:
      type: object
      required:
        - settlementId
      properties:
        settlementId:
          type: string
          description: Identifier of the settlement instance to withdraw
        reason:
          type: string
          description: Optional human-readable reason for the withdrawal
    Settlement:
      type: object
      required:
        - id
        - definitionId
        - clientId
        - accountId
        - currency
        - instrumentType
        - instrumentRef
        - claims
        - status
      properties:
        id:
          type: string
        definitionId:
          type: string
        clientId:
          type: string
          format: uuid
        accountId:
          type: string
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: 3-digit currency code (ISO 4217)
        instrumentType:
          type: string
          enum:
            - PROMISE_TO_PAY
            - INSTALMENT_PLAN
            - DIRECT
        instrumentRef:
          type: string
        claims:
          type: array
          items:
            type: object
            required:
              - externalClaimRef
              - computedDiscount
            properties:
              externalClaimRef:
                type: string
              computedDiscount:
                type: integer
                description: Computed discount amount in minor units (cents)
        status:
          type: string
          enum:
            - ACTIVE
            - FULFILLED
            - BREACHED
            - WITHDRAWN
        createdAt:
          type: string
          format: date-time
        fulfilledAt:
          type: string
          format: date-time
        breachedAt:
          type: string
          format: date-time
        withdrawnAt:
          type: string
          format: date-time
    SetSettlementDefinition:
      allOf:
        - $ref: '#/components/schemas/ActionResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SettlementDefinitionInput'
    GetSettlement:
      allOf:
        - $ref: '#/components/schemas/ActionResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Settlement'
    GetSettlements:
      allOf:
        - $ref: '#/components/schemas/ActionResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Settlement'
