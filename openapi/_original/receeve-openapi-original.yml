      allOf:
        - $ref: '#/components/schemas/ActionResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CreditClaimInput'
    DebitClaimActionResponse:
      allOf:
        - $ref: '#/components/schemas/ActionResponse'
        - type: object
