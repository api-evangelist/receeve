asyncapi: 2.6.0
info:
  title: Receive (Receeve) Webhook Events
  version: 1.53.1
  description: Signed outbound webhook event catalog for InDebted's Receive (formerly Receeve) debt servicing
    platform. Every event is delivered as an HTTP POST with a common envelope and an RSA/SHA-256 signature
    (base64) computed over payloadAsString using the publicKey InDebted provides. Verify signatures before
    trusting a payload; use messageId for idempotent de-duplication. Captured from the published webhook
    reference.
  contact:
    name: InDebted Receive
    url: https://docs.indebted.co/docs/receive/integration/list-of-webhooks
defaultContentType: application/json
