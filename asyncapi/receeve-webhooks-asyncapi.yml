components:
  messages:
    ReceiveWebhookEvent:
      name: ReceiveWebhookEvent
      title: Receive webhook event
      summary: Common signed webhook envelope for all Receive events.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/WebhookEnvelope'
  schemas:
    WebhookEnvelope:
      type: object
      required:
      - payload
      - signature
      properties:
        payload:
          type: object
          properties:
            details:
              type: object
              description: Event-specific fields plus the messageType discriminator.
              properties:
                messageType:
                  type: string
                  description: The event type, e.g. event.claim.created
                accountReference:
                  type: string
                  description: Account identifier in the external system
                claimRef:
                  type: string
                  description: Claim identifier in the external system
                receiveClaimRef:
                  type: string
                  description: Internal claim identifier in Receive
                externalDebtorRef:
                  type: string
                  description: Debtor identifier in the external system
            messageId:
              type: string
              description: Unique id for webhook de-duplication
            timestamp:
              type: string
              format: date-time
              description: ISO 8601 event timestamp
            user:
              type: object
              properties:
                id:
                  type: string
                poolId:
                  type: string
                originator:
                  type: string
        payloadAsString:
          type: string
          description: Canonical string form of payload used as the signed data
        signature:
          type: string
          description: base64 RSA/SHA-256 signature over payloadAsString, verified with the InDebted publicKey
x-provenance:
  generated: '2026-07-21'
  method: searched
  source: https://docs.indebted.co/docs/receive/integration/list-of-webhooks
  validation: https://docs.indebted.co/docs/receive/integration/use-cases/webhook-validation-use-case
  event_count: 76
  signature:
    algorithm: RSA SHA-256
    encoding: base64
    signed_field: payloadAsString
    key: publicKey provided by InDebted
